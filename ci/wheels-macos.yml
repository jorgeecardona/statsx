# Child pipeline that builds and uploads the macOS wheels (Apple silicon and Intel).
# scripts/pypi-wheels plan picks this file only when a macOS wheel of the version is missing,
# because the hosted macOS runner bills at cost factor 6. PyPI accepts new files on an existing
# version, and --skip-existing makes a re-run a no-op. One Apple-silicon runner builds both
# arches: x86_64 is a cross-compile that needs only the Rust target.
wheels-macos:
  tags:
    - saas-macos-medium-m1
  image: macos-15-xcode-16
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  environment:
    name: pypi
    url: https://pypi.org/project/statsx/
  variables:
    MACOSX_DEPLOYMENT_TARGET: "11.0"
  script:
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
    - export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
    - rustup target add aarch64-apple-darwin x86_64-apple-darwin
    - uv venv --python 3.13 .venv
    - uv pip install --python .venv maturin twine
    # cp311-abi3: one wheel per arch covers Python 3.11+, the same as the Linux wheels.
    - .venv/bin/maturin build --release --target aarch64-apple-darwin -o dist
    - .venv/bin/maturin build --release --target x86_64-apple-darwin -o dist
    - ls dist
    # Mint a one-shot PyPI token from the job's OIDC id_token (same exchange as scripts/pypi-publish).
    - >-
      TOKEN=$(curl -sSf -X POST https://pypi.org/_/oidc/mint-token
      -H 'Content-Type: application/json' -d "{\"token\": \"$PYPI_ID_TOKEN\"}"
      | .venv/bin/python -c 'import json,sys; print(json.load(sys.stdin)["token"])')
    - TWINE_USERNAME=__token__ TWINE_PASSWORD="$TOKEN" .venv/bin/twine upload --skip-existing --non-interactive dist/*.whl
  artifacts:
    paths:
      - dist
    expire_in: 1 week
