[project]
name = "statsx"
version = "0.1.72"  # static: maturin is the build backend (it cannot read __version__ from a Python file; it reads Cargo.toml or this line). Keep in sync with rust/Cargo.toml.
description = "Statistics for experiments and forecasts, with a Rust extension and NumPy the only dependency"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jorge Cardona", email = "jorgeecardona@gmail.com" }]
keywords = ["statistics", "bayesian", "forecasting", "bootstrap", "sequential-testing", "confidence-intervals", "model-evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# docs are an extra (not a uv dependency-group): CI installs them with `uv sync --extra docs`
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]

[project.urls]
Homepage = "https://gitlab.com/cardona-oss/statsx"
Repository = "https://gitlab.com/cardona-oss/statsx"
Changelog = "https://gitlab.com/cardona-oss/statsx/-/blob/main/CHANGELOG.md"
Issues = "https://gitlab.com/cardona-oss/statsx/-/issues"

[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

# Mixed layout: the Python package is src/statsx/, and the Rust extension is
# built from rust/Cargo.toml as the statsx._accel submodule and shipped in the
# same wheel. The pyo3 abi3-py311 feature makes it ONE wheel per platform (tag cp311-abi3);
# requires-python limits installs to Python 3.12+.
[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "statsx._accel"
features = ["pyo3/extension-module"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright[nodejs]>=1.1.390",
    "pytest>=8",
    "prodc>=0.11.4,<0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --junitxml=build/junit.xml"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
# The canonical base ignore list shared across the oss/ libraries. E501 (line length) is handled by
# the formatter; COM812/ISC001 conflict with the formatter; D1/D401 relax docstring presence/mood;
# TRY003/EM101/EM102 allow inline exception messages; CPY001 drops the copyright-header demand;
# PLC0415 allows non-top-level imports; TC001/TC002/TC003 don't force type-only import blocks.
ignore = [
    "E501",
    "COM812",
    "ISC001",
    "D1",
    "D401",
    "TRY003",
    "EM101",
    "EM102",
    "CPY001",
    "PLC0415",
    "TC001",
    "TC002",
    "TC003",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Tests may assert (S101), use magic values (PLR2004), take unused fixtures (ARG), pass Any to typed
# calls (ANN401), and group assertions pytest would otherwise split (PT018).
"tests/**/*.py" = ["S101", "PLR2004", "ARG", "ANN401", "PT018"]

[tool.ruff.lint.isort]
known-first-party = ["statsx"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
