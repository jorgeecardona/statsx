site_name: statsx
site_url: https://cardona-oss.gitlab.io/statsx/
site_description: "Statistics for experiments and forecasts, with a Rust extension and NumPy the only dependency"
repo_url: https://gitlab.com/cardona-oss/statsx
repo_name: cardona-oss/statsx
copyright: MIT &copy; Jorge Cardona

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [".", "docs"]
      check_paths: true
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js

# docs/issues/ is the follow-up register (`cabildo issues`), read in the repo, not published:
# its links point at source files that are not part of the site, so --strict would fail on them.
exclude_docs: |
  issues/

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            heading_level: 3
            show_source: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            docstring_section_style: spacy

nav:
  - Home: index.md
  - Which method do I use?: choose.md
  - Methods:
      - Always-valid inference: methods/always-valid.md
      - Group sequential bounds: methods/group-sequential.md
      - Spending a budget over arms: methods/arms.md
      - Distributions and goodness of fit: methods/distributions.md
      - Drift between two samples: methods/drift.md
      - Compare models on one scale: methods/model-comparison.md
      - Rank systems from pairwise results: methods/pairwise.md
      - Update ratings from a stream of results: methods/rating.md
      - Check MCMC draws and their Monte Carlo error: methods/convergence.md
      - Check that a posterior method is correct: methods/sbc.md
      - Trend, season and forecast of a count series: methods/trend.md
      - Effect of an intervention on a count series: methods/impact.md
      - Tests for paired results, equivalence and many tests: methods/tests.md
      - Cluster points: methods/clustering.md
      - Map points in 2 or 3 dimensions: methods/embedding.md
      - Reduce many columns with PCA: methods/pca.md
      - Calibration of predicted probabilities: methods/calibration.md
      - Intervals for a proportion, an effect size and any statistic: methods/intervals.md
      - Plan a run, power, sample size and allocation: methods/design.md
      - Time to finish a task: methods/duration.md
      - Backtest a count forecast: methods/backtest.md
      - Agreement between raters: methods/agreement.md
      - Priors, conjugate updates and posterior summaries: methods/bayes.md
      - Decisions under uncertainty: methods/decisions.md
  - Recipes:
      - Compare two timing runs: recipes/compare-timings.md
      - Fit a short series, or a series with holes: recipes/short-and-gapped-series.md
      - Threads, containers and repeat runs: recipes/threads.md
  - Move from fastumap: migrate-from-fastumap.md
  - API reference: api.md
  - Ideas and open questions: ideas.md
  - Changelog: changelog.md
