who: caller analysing count time series

needs:

  - id: TS-1
    text: >
      When the caller has a monthly count series with seasonality and noise, they can get the trend
      with the seasonality and noise removed, so they can analyse the trend alone.
    sources:
      - {kind: primary, date: 2026-11-11, who: maintainer, quote: "remove the noise, remove the seasonality so I can get the trend and based on that being able to do some analysis"}
      - {kind: secondary, date: 2026-11-12, locator: "design draft from a consumer project (private, not linked)"}
    must: true
    proofs:
      - "test:tests/test_trend.py::test_trend_follows_the_true_trend_without_the_season"
      - "test:tests/test_trend.py::test_trend_works_on_low_counts"

  - id: TS-2
    text: >
      When the caller fits a structural time series to counts, they can get nested 50/80/95% credible
      bands for each past and future month, and the bands widen with the forecast horizon.
    sources:
      - {kind: secondary, date: 2026-11-12, locator: "design draft from a consumer project (private, not linked)"}
    must: true
    proofs:
      - "test:tests/test_trend.py::test_forecast_bands_are_nested_and_widen_with_the_horizon"
      - "test:tests/test_trend.py::test_forecast_bands_cover_held_out_months"

  - id: TS-3
    text: >
      When the caller asks whether the series is rising, they can get P(slope > 0) from the posterior,
      not a p-value.
    sources:
      - {kind: secondary, date: 2026-11-12, locator: "design draft from a consumer project (private, not linked)"}
    proofs:
      - "test:tests/test_trend.py::test_probability_of_increase_follows_the_slope"

  - id: TS-4
    text: >
      When an observed month falls outside the 95% band the model expected for it, the caller
      can see it flagged as an anomaly given trend and season.
    sources:
      - {kind: secondary, date: 2026-11-12, locator: "design draft from a consumer project (private, not linked)"}
    proofs:
      - "test:tests/test_trend.py::test_months_outside_the_expected_band_are_flagged_as_anomalies"
      - "test:tests/test_trend.py::test_clean_series_are_rarely_flagged"

  - id: TS-5
    text: >
      When the fit check fails (Newton not converged, k-hat above 0.7, or too little importance-sampling
      ESS), the caller can get no forecast and the reason, never a downgraded one.
    sources:
      - {kind: secondary, date: 2026-11-12, locator: "design draft from a consumer project (private, not linked)"}
    must: true
    proofs:
      - "test:tests/test_trend.py::test_a_failed_fit_check_gives_an_error_with_reasons_and_no_fit"
      - "test:tests/test_trend.py::test_each_check_names_its_reason"

  - id: TS-6
    text: >
      When the caller builds the model, they can choose the season period, the number of harmonics,
      regressor terms, and a Poisson or NegativeBinomial likelihood, instead of one fixed monthly
      shape.
    sources:
      - {kind: secondary, date: 2026-11-12, locator: "design draft from a consumer project (private, not linked)"}
    proofs:
      - "test:tests/test_trend.py::test_regressor_terms_are_learned_and_needed_for_the_forecast"
      - "test:tests/test_trend.py::test_forecast_follows_the_future_regressor"
      - "test:tests/test_trend.py::test_poisson_recovers_the_trend_of_poisson_counts"
      - "test:tests/test_trend.py::test_poisson_on_overdispersed_counts_puts_the_noise_in_the_trend"
      - "test:tests/test_trend.py::test_the_season_period_and_harmonics_are_chosen_by_the_caller"

  - id: TS-7
    text: >
      When the caller has control series and an intervention date, they can get the posterior of the
      effect (observed minus counterfactual), with a credible band and P(effect > 0).
    sources:
      - {kind: primary, date: 2026-11-11, who: maintainer, quote: "build a tool not just for this type of Bayesian analysis for forecasting but also for causal inference"}
    proofs:
      - "test:tests/test_impact.py::test_a_large_effect_is_found_with_its_size"
      - "test:tests/test_impact.py::test_no_effect_is_rarely_called_an_effect"
      - "test:tests/test_impact.py::test_the_result_states_its_assumption_and_sample_size"

  - id: TS-8
    text: >
      When the caller backtests a forecast with rolling origins, they can get CRPS and interval
      coverage, so a forecast claim can be checked.
    sources:
      - {kind: secondary, date: 2026-11-12, locator: "design draft from a consumer project (private, not linked)"}
    proofs:
      - "test:tests/test_backtest.py::test_backtest_scores_every_origin_with_crps_and_coverage"
      - "test:tests/test_backtest.py::test_backtest_shows_a_better_forecast_has_a_lower_crps"
      - "test:tests/test_backtest.py::test_every_series_is_reported_and_refused_origins_are_counted"
      - "test:tests/test_backtest.py::test_crps_matches_the_closed_form_for_a_normal_forecast"

  - id: TS-9
    text: >
      When the caller has a series shorter than two seasons, they can fit a trend with the Fourier
      harmonics the length supports, or with no season, and an error says which condition failed.
    sources:
      - {kind: secondary, date: 2026-11-18, locator: "GitLab issue cardona-oss/statsx#1, filed from a consumer project"}
    proofs:
      - "test:tests/test_trend_gaps.py::test_a_series_of_one_to_two_seasons_is_fitted_with_the_harmonics_it_supports"
      - "test:tests/test_trend_gaps.py::test_the_error_names_the_condition_that_failed_and_what_would_work"
      - "test:tests/test_trend_gaps.py::test_a_fit_without_a_season_works_on_a_short_series_and_forecasts"

  - id: TS-10
    text: >
      When the caller has counts with months that were not observed (a grouped query with holes),
      they can mark them as NaN or give the month index, and the fit skips them in the likelihood
      while the drift and the season still advance across them.
    sources:
      - {kind: secondary, date: 2026-11-18, locator: "GitLab issue cardona-oss/statsx#2, filed from a consumer project"}
    proofs:
      - "test:tests/test_trend_gaps.py::test_a_missing_month_keeps_the_season_in_phase_where_dropping_it_does_not"
      - "test:tests/test_trend_gaps.py::test_imputing_a_missing_month_narrows_the_band_by_pretending_to_know_it"
      - "test:tests/test_trend_gaps.py::test_an_index_is_the_same_as_nan_in_the_dense_series"
      - "test:tests/test_trend_gaps.py::test_a_nan_month_is_not_observed_and_infinities_and_negatives_are_refused_separately"

  - id: TS-11
    text: >
      When the caller has a count series with little or no overdispersion (a well-controlled
      process), they can fit a trend, and a failed fit check says its cause and what to change.
    sources:
      - {kind: secondary, date: 2026-11-18, locator: "GitLab issue cardona-oss/statsx#4, filed from a consumer project"}
    proofs:
      - "test:tests/test_trend.py::test_exactly_poisson_counts_are_fitted_not_refused"
      - "test:tests/test_trend.py::test_fit_check_reason_names_a_remedy"

  - id: TS-12
    text: >
      When the caller wants a forecast only if one is available, they can catch one base error that
      covers both a series that cannot be fitted and a fit that did not pass its check.
    sources:
      - {kind: secondary, date: 2026-11-18, locator: "GitLab issue cardona-oss/statsx#7, filed from a consumer project"}
    proofs:
      - "test:tests/test_trend.py::test_one_except_catches_both_kinds_of_cannot_fit"

  - id: TS-13
    text: >
      When the caller ports a count model onto fit_trend, they can set the prior scales of the
      intercept, the slope, the Fourier coefficients and the regressors, so the priors match.
    sources:
      - {kind: secondary, date: 2026-11-18, locator: "GitLab issue cardona-oss/statsx#5, filed from a consumer project"}
    proofs:
      - "test:tests/test_trend.py::test_the_default_prior_scales_change_nothing"
      - "test:tests/test_trend.py::test_each_prior_scale_shrinks_its_own_coefficients"
      - "test:tests/test_trend.py::test_a_prior_scale_must_be_positive_and_finite"

  - id: TS-14
    text: >
      When the caller fits many series of different lengths with one call, they can ask for as
      many harmonics as each series supports, up to a ceiling, without writing the bound themselves.
    sources:
      - {kind: secondary, date: 2026-11-18, locator: "GitLab issue cardona-oss/statsx#6, filed from a consumer project"}
    proofs:
      - "test:tests/test_trend.py::test_auto_harmonics_take_what_the_length_supports_up_to_the_ceiling"
      - "test:tests/test_trend.py::test_the_ceiling_of_auto_harmonics_is_settable_and_never_exceeds_the_support"

  - id: TS-15
    text: >
      When the caller has a weekly series, they can give the period as a number that is not whole
      (52.1775 weeks in a year), so the season stays in phase with the calendar.
    sources:
      - {kind: secondary, date: 2026-11-18, locator: "GitLab issue cardona-oss/statsx#8, filed from a consumer project"}
    proofs:
      - "test:tests/test_trend.py::test_a_weekly_period_that_is_not_a_whole_number_keeps_the_season_in_phase"
      - "test:tests/test_trend.py::test_the_two_season_rule_and_the_period_check_accept_a_float_period"
