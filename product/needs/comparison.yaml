who: caller comparing two or more systems

needs:

  - id: CO-1
    text: >
      When the caller compares paired results, they can run McNemar, a sign test, Wilcoxon, or a
      bootstrap difference.
    sources:
      - {kind: secondary, date: 2026-11-12, locator: "design draft from a consumer project (private, not linked)"}
    proofs:
      - "test:tests/test_paired.py::test_the_sign_test_matches_the_binomial_sum_and_drops_ties"
      - "test:tests/test_paired.py::test_mcnemar_exact_is_a_binomial_test_on_the_disagreements"
      - "test:tests/test_paired.py::test_mcnemar_chi_square_matches_the_textbook_value"
      - "test:tests/test_paired.py::test_wilcoxon_matches_the_enumeration_of_all_sign_assignments_with_and_without_ties"
      - "test:tests/test_paired.py::test_wilcoxon_matches_the_hollander_wolfe_depression_example"
      - "test:tests/test_paired.py::test_the_bootstrap_difference_is_an_estimate_with_an_interval"

  - id: CO-2
    text: >
      When the caller ranks items from pairwise results, they can get Bradley-Terry or Davidson (ties
      modelled), with intervals from item-level resampling.
    sources:
      - {kind: secondary, date: 2026-11-12, locator: "design draft from a consumer project (private, not linked)"}
    proofs:
      - "test:tests/test_pairwise.py::test_the_fit_is_the_maximum_of_the_penalized_log_likelihood"
      - "test:tests/test_pairwise.py::test_two_systems_have_the_closed_form_bradley_terry_and_davidson_fits"
      - "test:tests/test_pairwise.py::test_strengths_and_the_tie_parameter_are_recovered_from_a_large_sample"
      - "test:tests/test_pairwise.py::test_item_level_intervals_are_wider_than_row_level_ones_when_rows_of_an_item_depend"
      - "test:tests/test_pairwise.py::test_the_item_level_interval_covers_the_population_value_of_the_estimand"

  - id: CO-3
    text: >
      When the caller runs many tests, they can correct with Benjamini-Hochberg, Holm, or Storey
      q-values.
    sources:
      - {kind: secondary, date: 2026-11-12, locator: "design draft from a consumer project (private, not linked)"}
    proofs:
      - "test:tests/test_multiple.py::test_holm_and_benjamini_hochberg_reject_what_the_1995_example_says"
      - "test:tests/test_multiple.py::test_adjusted_values_match_the_definitions_by_brute_force"
      - "test:tests/test_multiple.py::test_benjamini_hochberg_keeps_the_false_discovery_rate_below_alpha"
      - "test:tests/test_multiple.py::test_storey_rejects_more_than_benjamini_hochberg_when_many_effects_are_real"

  - id: CO-4
    text: >
      When the caller asks if two systems are practically the same, they can get one TOST and ROPE
      definition used across all callers.
    sources:
      - {kind: secondary, date: 2026-11-12, locator: "design draft from a consumer project (private, not linked)"}
    proofs:
      - "test:tests/test_equivalence.py::test_tost_is_the_same_as_the_interval_lying_inside_the_margin"
      - "test:tests/test_equivalence.py::test_the_error_rate_at_the_edge_of_the_margin_is_at_most_alpha"
      - "test:tests/test_equivalence.py::test_the_same_margin_defines_the_rope_probability_and_the_comparison"

  - id: CO-5
    text: >
      When the caller has results of several models of different size and quality on shared tasks
      (cells may be missing), they can put the models on one ability scale with intervals, compare
      their token use on the same tasks, and compare their cost per solved task.
    sources:
      - {kind: primary, date: 2026-11-18, who: maintainer, quote: "I need in principle to ocmpare models of different quality like qwen 3 of different sizes with gemma of differnet sizes and haius and sonnets but I need to find a way to calibrate them in a way that I can compare then"}
    proofs:
      - "test:tests/test_evals.py::test_the_mode_has_a_zero_gradient_and_the_covariance_is_minus_the_inverse_hessian"
      - "test:tests/test_evals.py::test_the_ability_difference_interval_has_its_stated_coverage"
      - "test:tests/test_evals.py::test_missing_cells_link_models_through_shared_tasks_and_unlinked_data_is_refused"
      - "test:tests/test_evals.py::test_the_token_ratio_equals_the_paired_t_interval_on_a_complete_design"
      - "test:tests/test_evals.py::test_cost_per_pass_interval_covers_the_true_cost_over_pass_rate"

  - id: CO-6
    text: >
      When the caller ran the same tasks on different infrastructure (GPU, driver, host, run
      batch), they can read a model ratio and a model ability after the infra effect is removed,
      get the infra effect with an interval, and be told which models bridge two infras. Data
      that leave models on a scale of their own are refused, and the models are named.
    sources:
      - {kind: secondary, date: 2026-11-18, locator: "GitLab issue #3 on cardona-oss/statsx, from the ComputeML benchmark runs"}
    proofs:
      - "test:tests/test_infra.py::test_the_model_ratio_is_recovered_and_the_90_percent_interval_covers_it"
      - "test:tests/test_infra.py::test_models_that_never_share_an_infra_are_refused_and_named"
      - "test:tests/test_infra.py::test_the_rasch_infra_shift_and_the_ability_gap_are_covered_at_close_to_the_stated_rate"
      - "test:tests/test_infra.py::test_the_bridge_between_two_infras_is_the_model_that_ran_on_both"

  - id: CO-7
    text: >
      When the caller ranks systems from pairwise results judged by several judges, they can get a
      position bias per judge (does the judge favour the first answer) with an interval, and
      strengths that are not tilted by it. Data where the order of the pairs is not mixed are
      refused, and the judges are named.
    sources:
      - {kind: primary, date: 2026-11-18, who: maintainer, quote: "something like uh a set of judges, um that they all have probably different judging criteria, then they give different results and then this all build like an arena"}
    proofs:
      - "test:tests/test_judges.py::test_the_position_bias_of_each_judge_is_recovered"
      - "test:tests/test_judges.py::test_the_90_percent_interval_of_the_bias_covers_the_truth_at_close_to_the_stated_rate"
      - "test:tests/test_judges.py::test_the_strengths_stay_right_when_the_stronger_system_is_shown_first_more_often"
      - "test:tests/test_judges.py::test_a_judge_that_always_sees_the_same_system_first_is_refused_and_named"

  - id: CO-8
    text: >
      When the caller ranks systems from pairwise results, they can read the strengths on the Elo
      scale (400 / ln 10 per log-odds unit) with intervals.
    sources:
      - {kind: primary, date: 2026-11-18, who: maintainer, quote: "the scoring use for um chess games. All the statistics around that, do you think we can include it in this tool"}
    proofs:
      - "test:tests/test_pairwise.py::test_elo_is_the_strength_on_the_400_per_factor_10_scale"
      - "test:tests/test_pairwise.py::test_elo_interval_holds_the_rating_and_moves_with_the_base"
    must: false

  - id: CO-9
    text: >
      When the caller has a stream of match results, they can update Elo and Glicko-2 ratings online.
    sources:
      - {kind: primary, date: 2026-11-18, who: maintainer, quote: "the scoring use for um chess games. All the statistics around that, do you think we can include it in this tool"}
    proofs:
      - "test:tests/test_rating.py::test_glicko2_reproduces_the_worked_example_of_glickman"
      - "test:tests/test_rating.py::test_a_player_without_games_keeps_the_rating_and_the_rd_grows"
      - "test:tests/test_rating.py::test_elo_update_is_zero_sum_and_moves_by_k_times_the_surprise"
      - "test:tests/test_rating.py::test_online_elo_recovers_the_odds_it_is_fed"
    must: false

  - id: CO-10
    text: >
      When several judges rank the same systems, the caller can get a strength per judge and a test of
      whether the judges rank the systems differently, since one strength per system assumes they agree.
    sources:
      - {kind: primary, date: 2026-11-18, who: maintainer, quote: "they all have probably different judging criteria, then they give different results"}
    proofs:
      - "test:tests/test_judge_fits.py::test_judges_that_agree_are_rarely_called_different"
      - "test:tests/test_judge_fits.py::test_judges_that_rank_the_systems_in_opposite_orders_are_found"
      - "test:tests/test_judge_fits.py::test_a_judge_that_does_not_link_all_systems_is_refused_and_named"
    must: false

