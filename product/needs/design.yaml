      differences, and equivalence margins.
    sources:
      - {kind: secondary, date: 2026-11-12, locator: "design draft from a consumer project (private, not linked)"}
    proofs:
      - "test:tests/test_design.py::test_paired_t_power_matches_the_published_value_and_a_simulation"
      - "test:tests/test_design.py::test_two_proportions_power_and_sample_size_match_the_fleiss_formula_and_an_exact_count"
      - "test:tests/test_design.py::test_paired_equivalence_power_is_exact_and_matches_the_tost_test"
