decisions:
- id: D-1
  text: 'The posterior of the structural time series is computed by the nested Laplace
    approximation over the hyperparameters, Rue, Martino & Chopin (2009), ''Approximate
    Bayesian inference for latent Gaussian models by using integrated nested Laplace
    approximations'', J. R. Stat. Soc. B 71(2):319-392, DOI 10.1111/j.1467-9868.2008.00700.x,
    with Laplace marginals of Tierney & Kadane (1986), JASA 81(393):82-86, DOI 10.1080/01621459.1986.10478240.
    The Laplace draws are corrected by importance sampling, and the fit is accepted
    only when the Pareto-smoothed importance weights pass the k-hat check of Vehtari,
    Simpson, Gelman, Yao & Gabry (2024), ''Pareto smoothed importance sampling'',
    JMLR 25(72). The fit check replaces R-hat: Newton converged at every grid point,
    positive definite Hessian, low grid-edge mass, k-hat <= min(1 - 1/log10(S), 0.7),
    importance-sampling ESS >= 400. A failed check returns no forecast and the reason.'
  needs:
  - TS-1
  - TS-2
  - TS-5
  alternatives:
  - 'NUTS, Hoffman & Gelman (2014), JMLR 15:1593-1623: not chosen for the structural
    series, slow on long count series (TFP docs; a Stan forum thread reports minutes);
    stays the candidate for the general posterior method (BA-4, BA-5), decided separately.'
  - 'Polya-Gamma Gibbs, Polson, Scott & Windle (2013), JASA 108(504):1339-1349: not
    chosen now, exact but needs about 1500-2500 lines of Rust (agent estimate, unverified)
    and has no check beyond R-hat; the fallback if the k-hat failure rate on real
    series is above 5%.'
  - 'Auxiliary mixture sampling, Fruhwirth-Schnatter et al. (2009): not chosen, Windle
    et al. report Polya-Gamma is better at small counts.'
  - 'Durbin-Koopman Gaussian approximation with importance sampling (1997, 2000):
    not chosen, it is the same idea without the hyperparameter grid and without the
    k-hat check.'
  - 'Particle MCMC, Andrieu, Doucet & Holenstein (2010): not chosen, too slow for
    many series.'
  consequences: 'About 5 hyperparameters at most; spike-and-slab priors are not possible
    under this route. A synthetic spike (60 series, T=60, adaptive 21x21 grid) failed
    k-hat 0.7 on 1 of 60 series (2%; a coarse 18x16 grid failed 6 of 60), so the grid
    is adaptive. The Rust fit gives the same posterior trend as the spike (RMSE 0.01-0.03
    between them, 6 series) at about 0.4 s per series. With 2000 draws, 2 of 400 synthetic
    series (T = 60 and 120, mean 0.3 to 30) were refused, both at mean 0.3 and T = 60;
    the 90% band covered the true trend 91-95% of the time. With 800 draws, 6 of 60 spike
    series would have failed ESS >= 400, so the default is 2000 draws. The grid-edge mass limit
    0.02 is about 3 times the largest mass seen in the spike (0.008). Not yet tested on real
    series or against timed NUTS. Switch to Polya-Gamma if more than 5% of real series fail the check.'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-16'
- id: D-2
  text: Conjugate updates (Beta-Binomial, Gamma-Poisson, Normal-Normal with known
    variance, Dirichlet-Multinomial) use the closed forms in Gelman, Carlin, Stern,
    Dunson, Vehtari & Rubin (2013), Bayesian Data Analysis, 3rd ed., CRC Press, DOI
    10.1201/b16018, chapters 2 and 3. Gamma uses the shape-rate form.
  needs:
  - BA-1
  alternatives:
  - 'Numerical posterior (grid or MCMC) for these models: not chosen, the closed form
    is exact and costs nothing.'
  - 'Shape-scale Gamma: not chosen, shape-rate makes the update a plain addition of
    count and exposure.'
  consequences: Only these four pairs are closed form; any other likelihood-prior
    pair goes to the general posterior method (D-1). Normal-Normal needs a known observation
    sd; unknown variance (Normal-Inverse-Gamma) is a separate decision.
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-16'
- id: D-3
  text: 'Bootstrap resamples by a named unit. i.i.d.: Efron (1979), ''Bootstrap methods:
    another look at the jackknife'', Annals of Statistics 7(1):1-26, DOI 10.1214/aos/1176344552.
    Stratified (resample within each stratum, sizes kept) and clustered (resample
    whole clusters): Davison & Hinkley (1997), ''Bootstrap Methods and their Application'',
    chapter 3, Cambridge University Press, DOI 10.1017/CBO9780511802843. Block: the
    moving block bootstrap of Kunsch (1989), ''The jackknife and the bootstrap for
    general stationary observations'', Annals of Statistics 17(3):1217-1241, DOI 10.1214/aos/1176347265.
    Interval: percentile, Efron & Tibshirani (1993), ''An Introduction to the Bootstrap'',
    DOI 10.1201/9780429246593.'
  needs:
  - ES-2
  alternatives:
  - 'Stationary bootstrap (Politis & Romano 1994) for series: not chosen first, the
    fixed block length is easier to state in the result; can be added as another unit.'
  - 'Circular block bootstrap: not chosen, the moving block is the reference method
    and the end effects are small for the series lengths we expect.'
  - 'Two-stage cluster resampling (clusters, then units within): not chosen, single-stage
    keeps within-cluster dependence intact and is what Davison & Hinkley recommend
    when clusters are the sampling unit.'
  consequences: The percentile interval undercovers in small samples; BCa (ES-3) is
    the fix and is a separate decision. The block length is the caller's choice; we
    do not pick it automatically. The statistic runs in Python, so speed is bounded
    by the caller's function; only the resample indices come from Rust.
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-16'
- id: D-4
  text: 'Random numbers come from our own xoshiro256++ generator seeded by SplitMix64:
    Blackman & Vigna (2021), ''Scrambled Linear Pseudorandom Number Generators'',
    ACM Transactions on Mathematical Software 47(4), DOI 10.1145/3460772. Integers
    in [0, n) use the multiply-shift method with rejection: Lemire (2019), ''Fast
    Random Integer Generation in an Interval'', ACM TOMS 45(1), DOI 10.1145/3230636.'
  needs:
  - ES-2
  alternatives:
  - 'The rand crate: not chosen, P-1 asks us to own the generator, and xoshiro256++
    is 30 lines.'
  - 'PCG64 (O''Neill 2014), the NumPy default: not chosen, it needs 128-bit multiplication
    on every draw; xoshiro256++ passes the same test batteries and is faster.'
  - 'Modulo reduction for ranges: not chosen, it is biased when n does not divide
    2^64.'
  consequences: Our streams do not match NumPy's for the same seed; results are reproducible
    within statsx only. The generator is not cryptographic.
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-16'
- id: D-5
  text: 'MCMC convergence uses rank-normalized split R-hat (the maximum of bulk and
    folded R-hat), bulk ESS and tail ESS (the smaller ESS of the 5% and 95% quantile
    indicators) from Vehtari, Gelman, Simpson, Carpenter & Burkner (2021), ''Rank-normalization,
    folding, and localization: An improved R-hat for assessing convergence of MCMC'',
    Bayesian Analysis 16(2):667-718, DOI 10.1214/20-BA1221. The autocorrelation sum
    is truncated by Geyer''s initial monotone sequence, Geyer (1992), ''Practical
    Markov chain Monte Carlo'', Statistical Science 7(4):473-483, DOI 10.1214/ss/1177011137.
    Defaults follow the paper: R-hat at most 1.01, bulk and tail ESS at least 400.
    Any divergent transition fails the check.'
  needs:
  - BA-5
  - TS-5
  alternatives:
  - 'Classic Gelman-Rubin R-hat (Gelman & Rubin 1992): not chosen, it misses chains
    that differ in scale or tails, which the folded and rank-normalized version detects.'
  - 'R-hat threshold 1.05 (the consumer project''s old gate): not chosen as default,
    the paper shows 1.05 passes chains that have not mixed; callers can still pass
    rhat_max=1.05.'
  - 'FFT autocovariance: not chosen, the direct sum stops at the Geyer cutoff, so
    it is short for chains that mix; switch if long, slow-mixing chains make it a
    bottleneck.'
  consequences: Results match ArviZ 0.22 to about 1e-13 on a fixed sample (test).
    Direct autocovariance is O(chains x draws x lags), slow for very long chains that
    mix badly. The check refuses; it never returns a downgraded result.
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-16'
- id: D-6
  text: 'The inverse standard normal CDF is Wichura (1988), ''Algorithm AS 241: The
    percentage points of the normal distribution'', Applied Statistics 37(3):477-484,
    DOI 10.2307/2347330, routine PPND16 (about 16 digits).'
  needs:
  - BA-5
  alternatives:
  - 'Acklam''s approximation: not chosen, about 1e-9 relative accuracy and not a peer-reviewed
    publication.'
  - 'Newton iteration on an erfc implementation: not chosen, slower and needs its
    own erfc first.'
  consequences: Matches mpmath to 1e-12 relative from 1e-300 to 1 - 1e-16 in tests.
    Any later special function (lgamma, digamma, erfc) is its own decision.
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-16'
- id: D-7
  text: 'Task duration is a Bayesian linear regression of log duration on log(1 +
    parameter), with the conjugate Normal-Inverse-Gamma prior: Gelman, Carlin, Stern,
    Dunson, Vehtari & Rubin (2013), Bayesian Data Analysis, 3rd ed., chapter 14, DOI
    10.1201/b16018; O''Hagan & Forster (2004), Kendall''s Advanced Theory of Statistics
    Vol. 2B, 2nd ed., chapter 11. The prediction is the posterior predictive (Student-t
    on the log scale), reported as its median and an equal-tailed interval from 20,000
    exact draws.'
  needs:
  - ET-1
  - ET-2
  alternatives:
  - 'Ordinary least squares with a prediction interval: not chosen, it has no prior,
    so it fails with very few past runs, which is the common case for a new task.'
  - 'Linear model on the raw scale (duration = a + b * files): not chosen, durations
    are positive and their noise grows with the size of the run; the log scale handles
    both.'
  - 'Exact Student-t quantiles: not chosen yet, they need the inverse regularized
    incomplete beta; Monte Carlo error with 20,000 draws is about 1% of the interval
    width.'
  consequences: A coefficient near 1 means duration proportional to that parameter;
    a sum of two costs (per file plus per GB) is approximated by a product of powers.
    Parameters must be >= 0. The interval has Monte Carlo error; it is fixed by the
    seed.
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-16'
- id: D-8
  text: Gamma random variables use Marsaglia & Tsang (2000), 'A simple method for
    generating gamma variables', ACM TOMS 26(3):363-372, DOI 10.1145/358407.358414,
    with their boost for shape < 1. Normal variables use inversion of the CDF with
    AS 241 (D-6).
  needs:
  - ET-2
  alternatives:
  - 'Ziggurat normal sampler (Marsaglia & Tsang 2000b): not chosen, inversion is simpler
    and reuses D-6; switch if sampling speed matters.'
  - 'Ahrens-Dieter gamma sampler: not chosen, more cases and constants for no gain
    in accuracy.'
  consequences: Each normal draw costs one AS 241 call (a log and a sqrt in the tails),
    slower than a ziggurat.
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-16'
- id: D-9
  text: Small dense symmetric positive definite systems use the Cholesky factorization,
    Golub & Van Loan (2013), 'Matrix Computations', 4th ed., Johns Hopkins University
    Press, ISBN 978-1-4214-0794-4, section 4.2.
  needs:
  - ET-1
  alternatives:
  - 'LAPACK through a Rust binding: not chosen, it adds a native library to every
    wheel for matrices of size 2 to 10.'
  - 'QR on the design matrix: not chosen, more stable for ill-conditioned designs,
    but the prior adds 1/coef_var to the diagonal, which keeps the normal equations
    well conditioned.'
  consequences: 'O(p^3) and unblocked: fine for a handful of parameters, not for large
    models (D-1 brings its own banded factor).'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-16'
- id: D-10
  text: 'log-gamma uses the Lanczos approximation with g = 7 and 9 coefficients (Godfrey''s
    set), Lanczos (1964), ''A precision approximation of the gamma function'', SIAM
    J. Numer. Anal. Ser. B 1:86-96, DOI 10.1137/0701008, with the reflection formula
    below 0.5. Digamma uses the recurrence up to x >= 12 and the asymptotic series,
    Bernardo (1976), ''Algorithm AS 103: Psi (digamma) function'', Applied Statistics
    25(3):315-317, DOI 10.2307/2347257, with Bernoulli terms up to x^-12 instead of
    AS 103''s three.'
  needs:
  - TS-1
  alternatives:
  - 'Stirling series for log-gamma with a recurrence shift: not chosen, Lanczos reaches
    1e-15 with one fixed formula.'
  - 'AS 103 as published (shift to 8.5, three series terms): not chosen, it gives
    about 1e-9; the extra terms give 1e-14.'
  consequences: Both match mpmath to 1e-13 relative from 1e-8 to 1e5 in tests. Defined
    for x > 0 only; NaN otherwise.
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-16'
- id: D-11
  text: The count likelihood is the negative binomial in the NB2 form (mean mu = exp(eta),
    Var = mu + mu^2 / alpha), Cameron & Trivedi (2013), 'Regression Analysis of Count
    Data', 2nd ed., chapter 3, Cambridge University Press, DOI 10.1017/CBO9781139013567.
    It is written on the log-mean scale eta with closed-form first and second derivatives
    in eta and the first derivative in alpha. The model sets alpha = 1 / (phi^2 +
    1e-3), as in the consumer project's earlier NumPyro model, so old and new fits
    are comparable.
  needs:
  - TS-1
  - TS-2
  alternatives:
  - 'NB1 (Var = mu (1 + delta)): not chosen, the earlier model is NB2 and NB2 is the
    usual form for overdispersed event counts.'
  - 'Poisson only: not chosen, natural event counts are overdispersed; Poisson is
    the limit alpha -> infinity and stays available.'
  consequences: The log-likelihood is concave in eta for fixed alpha (tested), which
    the D-1 Newton step relies on. Derivatives are checked against finite differences.
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-16'
- id: D-12
  text: 'A forecast continues each posterior draw: the drift extends as a Gaussian random
    walk with that draw''s sigma, the fixed effects (level, slope, Fourier season) are
    evaluated at the future months, and a new count is drawn from the negative binomial
    with that draw''s dispersion. This is forecasting a state space model by simulating
    the state forward, Durbin & Koopman (2012), ''Time Series Analysis by State Space
    Methods'', 2nd ed., chapter 4, Oxford University Press, DOI 10.1093/acprof:oso/9780199641178.001.0001.
    Bands are central quantiles of the draws at 50%, 80% and 95%, nested by construction.
    The Python layer draws with NumPy''s Generator (PCG64), seeded by the caller.'
  needs:
  - TS-2
  - TS-4
  alternatives:
  - 'Closed-form Gaussian forecast variance: not chosen, the count likelihood is not
    Gaussian and the draws already carry the uncertainty of sigma and the level.'
  - 'Our own Rust sampler for the forecast draws: not chosen now, the cost is small
    (2000 x 72 values) and NumPy is the allowed run-time dependency.'
  consequences: 'The trend band widens with the horizon (80% width 0.56, 0.77, 0.98 at
    1, 6 and 12 months ahead on synthetic series of mean 30). On 12 held-out months of
    synthetic series of mean 30, 95% bands covered 96% and 80% bands 82%. At mean 1 and
    5 the bands over-cover (80% bands covered 94% and 88%) because a count is an integer
    and because the half-normal(0.2) prior on sigma is wider than the true drift at 60
    months. The season repeats and the slope continues unchanged.'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-17'
- id: D-13
  text: 'An observed month is flagged as an anomaly when its count lies outside the
    central 95% band of the posterior predictive distribution of a new count for that
    month, given the trend and the season. This is a posterior predictive check, Gelman,
    Carlin, Stern, Dunson, Vehtari & Rubin (2013), ''Bayesian Data Analysis'', 3rd ed.,
    chapter 6, CRC Press, DOI 10.1201/b16018. The report gives the band, the observed
    count and the direction (below or above) for every month.'
  needs:
  - TS-4
  alternatives:
  - 'Leave-one-out predictive intervals (PSIS-LOO, Vehtari, Gelman & Gabry 2017): not
    chosen now, the in-sample band is simpler and the Laplace draws would need a
    second importance step; the in-sample band is conservative.'
  - 'A p-value from a test statistic: not chosen, the need asks for the band the model
    expected, and the project reports posteriors, not p-values.'
  consequences: 'The fit has seen the month it checks, so a large outlier can pull the
    trend and the band toward itself; the flags are conservative. On synthetic series
    with no outlier (60 months, 30 series each) 0.7% of months were flagged at mean 3 and
    1.4% at mean 30, below the nominal 5%. At mean 30 with strong overdispersion (size 5)
    a count of twice the expected value was flagged 33% of the time and four times the
    expected value 73% of the time.'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-17'
- id: D-14
  text: 'Regressor terms enter the log mean as fixed coefficients in the latent field,
    next to the level, slope and Fourier season, as in a structural time series with
    explanatory variables, Harvey (1989), ''Forecasting, Structural Time Series Models
    and the Kalman Filter'', Cambridge University Press, DOI 10.1017/CBO9781107049994.
    Each regressor is standardized (mean 0, sd 1) and its coefficient has a N(0, 1)
    prior. The Poisson likelihood is the limit of the negative binomial as alpha goes
    to infinity (Cameron & Trivedi 2013, chapter 3, as in D-11): it has no dispersion
    parameter, so the hyperparameter grid has one dimension. The season period and the
    number of harmonics are arguments.'
  needs:
  - TS-6
  - TS-7
  alternatives:
  - 'Regressor coefficients that follow a random walk (time-varying effects): not chosen,
    the caller asked for regressor terms, and a constant effect keeps the Laplace
    approximation to about 2 hyperparameters.'
  - 'Poisson as a negative binomial with a fixed large alpha: not chosen, it is not
    exact and the Poisson derivatives are simpler.'
  consequences: 'A Poisson fit of overdispersed counts puts the extra variance into the
    random-walk drift: on synthetic series (mean 30, size 3) the drift sd was 0.7-0.9
    against a true 0.04, and the trend error 0.5-0.7 against 0.1 for the negative binomial.
    The trend of such a fit is not free of noise, so the negative binomial is the default.
    A regressor effect is separate from the trend: the trend is level + slope + drift,
    and a forecast needs the regressors for the forecast months.'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-17'
- id: D-15
  text: 'The effect of an intervention is the observed count minus the counterfactual,
    where the counterfactual is the posterior predictive count of the structural series
    fitted on the months before the intervention with the control series as regressors
    (decision D-14), forecast over the months after it with the controls'' values,
    Brodersen, Gallusser, Koehler, Remy & Scott (2015), ''Inferring causal impact using
    Bayesian structural time-series models'', Annals of Applied Statistics 9(1):247-274,
    DOI 10.1214/14-AOAS788. Controls enter as log(1 + count). The result gives the
    effect for each month, the cumulative and the average effect as an Estimate with
    its interval and its assumption, and P(cumulative effect > 0).'
  needs:
  - TS-7
  alternatives:
  - 'Spike-and-slab selection of controls, as in the paper: not chosen, the latent
    prior must be Gaussian under decision D-1; every control gets a N(0, 1) prior on its
    standardized coefficient, so many weak controls dilute the fit.'
  - 'Difference-in-differences or synthetic control: not chosen, the maintainer asked
    for the Bayesian structural route with a posterior of the effect.'
  consequences: 'The data cannot check that the controls are unaffected by the
    intervention; the result states that assumption. On synthetic series (60 months,
    intervention at 48, 3 controls, 40 series per row, drift prior scale 0.05) the 95%
    cumulative interval excluded 0 in 10% of series with no effect, in 3% with a 10% effect
    and in 33% with a 30% effect (P(effect > 0) above 0.95 in 45%): the power is low for
    12 post months and noisy counts. The mean cumulative estimate was 154 against a true 168
    at a 30% effect, and -5 against 0 with no effect. With the default drift prior scale
    0.2 the power at 30% was 10%.'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-17'
- id: D-16
  text: 'A forecast is backtested with rolling origins: at each origin the model is
    refitted on the months before it and forecasts the next months, Tashman (2000),
    ''Out-of-sample tests of forecasting accuracy: an analysis and review'', International
    Journal of Forecasting 16(4):437-450, DOI 10.1016/S0169-2070(00)00065-0. The forecast
    draws are scored with the CRPS, estimated from the draws as E|X - y| - E|X - X''|/2
    (sorted-draws form), a strictly proper score, Gneiting & Raftery (2007), JASA
    102(477):359-378, DOI 10.1198/016214506000001437, and with the share of observed
    counts inside the 50%, 80% and 95% bands. An origin whose fit fails the fit check is
    counted as refused and reported, never dropped; every series given is reported.'
  needs:
  - TS-8
  alternatives:
  - 'A single train/test split: not chosen, one origin cannot show how the score changes
    with the forecast horizon or the season.'
  - 'Log score: not chosen, the draws give no density for counts without an extra
    smoothing step, and the CRPS is in the units of the counts.'
  consequences: 'The result carries the refused origins, so a method that refuses hard
    series cannot look better than one that forecasts them. Reporting all series follows
    Roque, Cerqueira, Soares & Torgo (2025), AAAI 39(19):20192-20199, who show that a
    choice of 4 datasets lets 46% of methods look best. On 10 synthetic series (96 months,
    horizon 6, origins every 6 months from 48; 80 origins, none refused) the bands covered
    54% (50% band), 81% (80%) and 96% (95%) of the counts, per series 44-62%, 65-92% and
    92-98%. The cost is one refit per origin: about 0.4 s each.'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-17'
- id: D-17
  text: 'A finished run is added to a duration model by the one-observation conjugate
    update of the Normal-Inverse-Gamma regression of decision D-7: with row x and
    log duration y, s = 1 + x^T V x and r = y - x^T m, the posterior is m + V x r / s,
    V - V x x^T V / s, shape + 1/2 and rate + r^2 / (2 s). This is recursive Bayesian
    least squares with a conjugate prior, Gelman, Carlin, Stern, Dunson, Vehtari & Rubin
    (2013), ''Bayesian Data Analysis'', 3rd ed., chapter 14, CRC Press, DOI 10.1201/b16018.'
  needs:
  - ET-4
  alternatives:
  - 'Refit from all past runs: not chosen, it needs every past run and costs more with
    each run; the update is exact, so nothing is lost.'
  - 'Exponential forgetting of old runs: not chosen now, the model assumes the process
    does not change; forgetting is a separate decision if durations drift.'
  consequences: 'The update gives the same model as a refit from all runs up to rounding
    (1e-9 relative, tested on 35 sequential updates). It keeps no past run, so it cannot
    detect that the process changed.'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-17'
- id: D-18
  text: 'When a parameter is unknown before a run, the duration model is refitted on the
    past runs with only the known parameters, and that model predicts. What the unknown
    parameter explained goes into the noise term, so the predictive interval is wider.
    The model keeps the past runs for this. Each model with a subset of the columns is
    the Normal-Inverse-Gamma regression of decision D-7, Gelman, Carlin, Stern, Dunson,
    Vehtari & Rubin (2013), ''Bayesian Data Analysis'', 3rd ed., chapter 14, CRC Press,
    DOI 10.1201/b16018.'
  needs:
  - ET-5
  alternatives:
  - 'Integrate over the unknown parameter using its past values: not chosen, it ignores
    that the unknown parameter is correlated with the known ones (files and size), and
    the subset regression uses that correlation.'
  - 'Fill the unknown value with its past mean: not chosen, it gives a narrow interval
    that does not say the value was unknown.'
  consequences: 'On synthetic runs (duration = 0.2 files + 5 GB, log-normal noise sd 0.2,
    300 past runs) the ratio upper/lower of the 90% interval was 2.5 with both parameters,
    2.7 with files only and 8.1 with none; coverage of 300 new runs was 92%, 90% and 91%.
    The refit costs one closed-form fit per prediction. A model keeps its past runs in
    memory, and a parameter that is unknown now but was always known before is assumed to
    relate to the others as in the past.'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-17'
- id: D-19
  text: 'The ETA of a running task from its progress is the constant-rate extrapolation
    e (1 - f) / f of the elapsed time e and the fraction done f, times a correction
    learned from past runs: the log of the ratio of the true time left to that
    extrapolation is regressed on log f with the Normal-Inverse-Gamma regression of
    decision D-7 (Gelman, Carlin, Stern, Dunson, Vehtari & Rubin (2013), ''Bayesian
    Data Analysis'', 3rd ed., chapter 14, CRC Press, DOI 10.1201/b16018). The interval is
    the Student-t predictive of that regression, mapped back to time left, so it is
    always positive. A progress report is (elapsed time, fraction done); the caller
    divides files done by files to do.'
  needs:
  - ET-3
  alternatives:
  - 'The constant-rate extrapolation alone: not chosen, it gives no interval and is biased
    when a task starts slowly or ends slowly (median error 39% on the synthetic tasks).'
  - 'Combine the progress estimate with the prediction from the input parameters (D-7):
    not chosen now, the need asks for the estimate from elapsed time and progress; the
    two can be combined later.'
  - 'A curve of progress against time per task (a hierarchical model): not chosen now,
    the simple regression is what the maintainer asked for.'
  consequences: 'On 1000 new synthetic tasks (progress (elapsed / duration)^0.7 with
    noise, 60 past runs with 9 reports each) the 90% interval held the true time left in
    93.7% of tasks, and the median relative error was 18%, against 39% for the
    constant-rate extrapolation. Reports of one run are treated as independent, which
    makes the interval slightly too narrow when runs differ much from each other. The
    model uses only reports inside a run, so it cannot say anything for a task that has
    not reported progress.'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-17'
- id: D-20
  text: 'Posterior draws are summarized by three functions. Quantiles use linear
    interpolation between order statistics (type 7), Hyndman & Fan (1996), The American
    Statistician 50(4):361-365, DOI 10.1080/00031305.1996.10473566. The credible interval
    is equal-tailed: the same share of draws below and above. The highest density
    interval is the shortest interval holding the stated share of the sorted draws, Chen
    & Shao (1999), Journal of Computational and Graphical Statistics 8(1):69-92, DOI
    10.1080/10618600.1999.10474802.'
  needs:
  - ES-4
  alternatives:
  - 'A set of intervals for a multimodal posterior (the HDR of Hyndman 1996): not chosen,
    the need asks for one interval; the docstring says what a gap means.'
  - 'Kernel density estimate for the HDI: not chosen, the sorted-draws form needs no
    bandwidth and is exact for the sample.'
  consequences: 'The HDI is one interval, so a sample with two separate modes gets an
    interval that spans the gap. On a Gamma(2, 1) sample the 90% HDI was shorter than the
    equal-tailed interval and started lower, as theory says for a right-skewed density.'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-17'
- id: D-21
  text: 'The bootstrap gives three intervals. Percentile: the quantiles of the replicates,
    Efron & Tibshirani (1993), ''An Introduction to the Bootstrap'', DOI
    10.1201/9780429246593. Basic: the quantiles reflected around the estimate, 2 t -
    q(1 - a/2) to 2 t - q(a/2), Davison & Hinkley (1997), ''Bootstrap Methods and their
    Application'', chapter 5, DOI 10.1017/CBO9780511802843. BCa: percentiles corrected for
    bias (z0 from the share of replicates below the estimate) and skew (acceleration from
    the jackknife), Efron (1987), ''Better bootstrap confidence intervals'', JASA
    82(397):171-185, DOI 10.1080/01621459.1987.10478410. BCa drops one observation (i.i.d.)
    or one cluster (clustered) for the jackknife; it is refused for stratified and block
    resampling, where that jackknife is not the right one. The normal CDF and quantile
    come from the Python standard library (statistics.NormalDist, AS 241).'
  needs:
  - ES-3
  alternatives:
  - 'Bootstrap-t (studentized): not chosen now, it needs a variance estimate for every
    replicate, which an arbitrary statistic does not give.'
  - 'BCa for stratified and block resampling with an adapted jackknife: not chosen, the
    formula for those units is not in the sources cited here.'
  consequences: 'On samples of a log-normal(0, 1) (mean 1.65), 90% intervals for the
    mean from 1999 resamples covered the true mean in 83% (percentile), 81% (basic) and
    82% (BCa) of 600 samples at n = 25, and 89%, 87% and 87% at n = 100. BCa did not beat
    the percentile interval in this setting; its interval was wider (1.38 against 1.24 at
    n = 25). Our BCa interval agreed with SciPy''s BCa interval to within resampling
    noise (at most 0.016) on 6 samples; this check ran once, outside the test suite, so
    SciPy stays out of the dependencies.'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-17'
- id: D-22
  text: 'The effect size of two independent groups is Cohen''s d (mean difference over
    the pooled sd), Cohen (1988), ''Statistical Power Analysis for the Behavioral
    Sciences'', 2nd ed., chapter 2, Lawrence Erlbaum, or Hedges'' g, d times the
    correction J = Gamma(df/2) / (sqrt(df/2) Gamma((df-1)/2)), Hedges (1981), Journal of
    Educational Statistics 6(2):107-128, DOI 10.3102/10769986006002107. The default is g.
    The analytic interval is the large-sample normal interval with variance (n1 + n2) /
    (n1 n2) + d^2 / (2 (n1 + n2)), times J^2 for g, Hedges & Olkin (1985), ''Statistical
    Methods for Meta-Analysis'', Academic Press. The alternative is a percentile bootstrap
    resampling within each group (decision D-21). A raw mean difference is available with
    the bootstrap interval. The result is an Estimate with the sample size and the
    assumption.'
  needs:
  - ES-5
  alternatives:
  - 'Interval by inverting the noncentral t distribution: not chosen, it needs the
    noncentral t quantile, which would be one more special function to write and test.'
  - 'Welch standardizer (unequal variances): not chosen now, the equal-variance pooled sd
    is the standard d; the assumption says so and the bootstrap does not rely on it for
    the interval.'
  consequences: 'On normal samples with a true effect of 0.5 the 90% analytic interval for
    g held it in 89%, 91% and 91% of 1000 samples with 10, 20 and 40 observations per
    group. The paired and the one-sample effect sizes are not included.'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-17'
- id: D-23
  text: 'A proportion has four intervals. Wilson: the score interval, Wilson (1927), JASA
    22(158):209-212, DOI 10.1080/01621459.1927.10502953. Agresti-Coull: Wilson''s center
    with (x + z^2/2) / (n + z^2), Agresti & Coull (1998), The American Statistician
    52(2):119-126, DOI 10.1080/00031305.1998.10480550. Clopper-Pearson: Beta quantiles,
    Clopper & Pearson (1934), Biometrika 26(4):404-413, DOI 10.1093/biomet/26.4.404.
    Jeffreys: the Beta(x + 1/2, n - x + 1/2) quantiles with the ends set to 0 and 1 for
    x = 0 and x = n, Brown, Cai & DasGupta (2001), Statistical Science 16(2):101-133, DOI
    10.1214/ss/1009213286. The default is Wilson. The regularized incomplete beta function
    (continued fraction, Didonato & Morris 1992; Press et al., Numerical Recipes, section
    6.4) and its inverse (Newton steps in a bracket) are in Rust.'
  needs:
  - ES-1
  alternatives:
  - 'Wald interval: not offered, its coverage is far below nominal at small n and near 0
    and 1 (Brown, Cai & DasGupta 2001).'
  - 'Mid-p or Blyth-Still intervals: not offered, the four above are the ones the need names.'
  consequences: 'Exact coverage of the 95% interval at 10 trials, over true proportions
    0.0005 to 0.9995: Wilson mean 95.4%, minimum 83.6% (near 0), above 91% from 0.1 to 0.9;
    Jeffreys 95.3% and 86.8%; Clopper-Pearson 98.4% and 96.1%; Agresti-Coull 96.5% and
    92.4%. Mean width 0.44 (Wilson), 0.43 (Jeffreys), 0.51 (Clopper-Pearson), 0.46
    (Agresti-Coull). At 30 trials the minimum coverage is 84.1%, 88.8%, 95.1% and 93.4%. The
    Beta CDF and quantile match mpmath to 1e-11 to 1e-13 relative on 17 cases; for very
    large a and b the continued fraction needs many iterations (a cap of 100000).'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-17'
- id: D-24
  text: 'Two posteriors are compared by Monte Carlo on paired independent draws: P(A > B)
    is the share of draws with A - B above 0, and practical equivalence is the share with
    |A - B| within a margin the caller gives, the region of practical equivalence of
    Kruschke (2018), ''Rejecting or accepting parameter values in Bayesian estimation'',
    Advances in Methods and Practices in Psychological Science 1(2):270-280, DOI
    10.1177/2515245918771304. A posterior is a distribution with a sample method (Beta,
    Gamma, Normal, LogNormal) or an array of draws. The Beta, Gamma and Normal samplers are
    in Rust: gamma by Marsaglia & Tsang (2000), beta as the ratio of two gammas computed
    from log gammas, normal by inversion, all from the generator of decision D-4. The result
    carries the Monte Carlo standard error.'
  needs:
  - BA-2
  alternatives:
  - 'Exact integrals (Cook 2005, ''Exact calculation of beta inequalities''): not chosen as
    the method, they exist for a few pairs only; they are the test reference for Beta.'
  - 'A default margin: not chosen, the margin is a decision about the quantity and has no
    universal value, so the caller must give it.'
  consequences: 'At 400000 draws the Monte Carlo error is about 0.0008; tests compare with the
    exact value for two Betas (Cook), two Normals and two Gammas with one rate. The draws of
    one posterior must not be paired with the other by an order they share (sorted draws would
    give the wrong answer); the docstring says so.'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-17'
- id: D-25
  text: 'An expert''s calibrated interval (low, high) at a level (default 90%) gives the
    lognormal whose central interval at that level is (low, high): mu = (ln low + ln
    high) / 2 and sigma = (ln high - ln low) / (2 z), with z the normal quantile at
    (1 + level) / 2. This is the quantile-matching elicitation of O''Hagan, Buck,
    Daneshkhah, Eiser, Garthwaite, Jenkinson, Oakley & Rakow (2006), ''Uncertain
    Judgements: Eliciting Experts'' Probabilities'', Wiley, DOI 10.1002/0470033312, for a
    positive quantity, with the lognormal of Gelman et al. (2013), ''Bayesian Data
    Analysis'', 3rd ed., appendix A.'
  needs:
  - BA-3
  alternatives:
  - 'Fit a Gamma or Beta to the interval: not chosen, the need names the lognormal; a
    gamma needs a numerical solve for two quantiles.'
  - 'Use the interval ends as the 5th and 95th percentiles of a normal on the raw scale:
    not chosen, it gives negative values for a positive quantity.'
  consequences: 'The result is exact: the 5% and 95% quantiles of the prior are the expert''s
    bounds to 1e-12. The function trusts that the expert is calibrated and cannot check it;
    the docstring says so. The median is the geometric middle of the bounds, not the
    arithmetic middle, and the mean is above the median.'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-17'
- id: D-26
  text: 'A cost with uncertain inputs is simulated by Monte Carlo, Metropolis & Ulam (1949),
    JASA 44(247):335-341, DOI 10.1080/01621459.1949.10483310: each uncertain input is drawn
    independently with its own seed (the seed plus its position), the cost model is called
    once with arrays of draws, and the result is the cost distribution with its mean (and
    the Monte Carlo error of that mean), a central interval, quantiles and tail
    probabilities. The expected value of perfect information is E[max over actions of
    utility] - max over actions of E[utility], Raiffa & Schlaifer (1961), ''Applied
    Statistical Decision Theory'', Harvard University Press, computed from joint draws of the
    utilities as in Claxton (1999), Journal of Health Economics 18(3):341-364, DOI
    10.1016/S0167-6296(98)00039-3. For two actions the break-even probability of acting is
    loss / (gain + loss); for a net benefit that depends on a threshold, the break-even point
    is the root found by bisection.'
  needs:
  - DC-1
  - DC-2
  alternatives:
  - 'Correlated inputs: not offered now, the inputs are independent; a caller with
    correlated inputs can build joint draws and pass one array.'
  - 'Expected value of partial perfect information (EVPPI) by regression metamodels
    (Strong, Oakley & Brennan 2014): not chosen now, the need asks for the expected value of
    information of the whole decision.'
  consequences: 'The same seed gives the same draws (tested). The Monte Carlo error of the
    mean is reported. The model must be written with NumPy operations on arrays, since it is
    called once. Draws of the inputs are independent; the draws of a decision''s utilities
    must come from the same joint draw of the inputs, which the caller arranges.'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-17'
- id: D-27
  text: 'Many tests are corrected by three methods. Holm (1979), Scandinavian Journal of
    Statistics 6(2):65-70: step-down, p(i) (m - i + 1) made non-decreasing, controls the
    family-wise error rate under any dependence. Benjamini-Hochberg (1995), JRSSB
    57(1):289-300, DOI 10.1111/j.2517-6161.1995.tb02031.x: step-up, p(i) m / i made
    non-decreasing from the largest p-value down, controls the false discovery rate for
    independent or positively dependent tests. Storey q-values, Storey (2002), JRSSB
    64(3):479-498, DOI 10.1111/1467-9868.00346, and Storey & Tibshirani (2003), PNAS
    100(16):9440-9445, DOI 10.1073/pnas.1530509100: Benjamini-Hochberg scaled by pi0, the
    estimated share of true nulls, from the share of p-values above lambda = 0.5, capped at 1.
    The result gives adjusted values in the input order, the rejections at alpha, and pi0.'
  needs:
  - CO-3
  alternatives:
  - 'Storey pi0 by a smoother over many lambda (the qvalue package): not chosen now, it
    needs a smoothing spline; the single-lambda estimate is the form in Storey (2002).'
  - 'Benjamini-Yekutieli (any dependence): not offered, the need names three methods.'
  consequences: 'On 200 z-tests with 20% real effects (3.5 sd), alpha 0.1, 1000 repetitions:
    Holm had a family-wise error rate of 8.4% and power 60%; Benjamini-Hochberg a false
    discovery rate of 8.0% (alpha times the share of nulls) and power 93%; Storey q-values 10.2%
    and 94%. With 50% real effects Storey had a false discovery rate of 10.2% at alpha 0.1, so
    it is slightly above its level; Benjamini-Hochberg had 5.0% and power 97%, Storey 99%. The
    adjusted values match a brute-force implementation of each definition.'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-17'
- id: D-28
  text: 'Practical equivalence has one definition, an EquivalenceMargin (low, high) with
    low < 0 < high, taken by every function that asks it; a number d means (-d, d). TOST:
    two one-sided t tests, equivalent when both reject at alpha, so the p-value is the larger
    of the two, Schuirmann (1987), Journal of Pharmacokinetics and Biopharmaceutics
    15(6):657-680, DOI 10.1007/BF01068419, as in Lakens (2017), Social Psychological and
    Personality Science 8(4):355-362, DOI 10.1177/1948550617697177. Two independent samples
    use the Welch standard error and Satterthwaite degrees of freedom, Welch (1947),
    Biometrika 34(1-2):28-35, DOI 10.1093/biomet/34.1-2.28; paired data use the differences.
    The Bayesian counterpart is the share of posterior draws of the difference inside the
    margin, the ROPE of Kruschke (2018), DOI 10.1177/2515245918771304, and decision D-24''s
    comparison uses the same margin. The Student t CDF and quantile are in Rust, from the
    incomplete beta function of decision D-23 (P(|T| > t) = I_{df/(df+t^2)}(df/2, 1/2)).'
  needs:
  - CO-4
  alternatives:
  - 'A margin relative to a reference value: not offered, the margin is on the difference
    and in the unit of the data; a caller can scale it.'
  - 'The equal-variance (Student) TOST: not chosen, Welch is as good when variances are equal
    and safer when not.'
  consequences: 'Simulation, margin 0.5, 2000 repetitions, 5% level: with a true difference
    at the edge of the margin, equivalence was declared in 4.6% (60 per group) and 5.1% (200
    per group) of samples, as the level says. With no difference the power was 71.5% at 60 per
    group and 99.9% at 200. The test equals the check that the 90% interval lies inside the
    margin (tested on 60 datasets). Student t values match mpmath to 1e-11 to 1e-13 on 13
    cases. A failed test does not show a difference.'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-17'
- id: D-29
  text: 'Paired results have four analyses. McNemar (1947), Psychometrika 12(2):153-157,
    DOI 10.1007/BF02295996: from the items where two systems disagree, the exact test is a
    two-sided binomial test of b out of b + c against one half (default); the chi-square form
    uses (|b - c| - 1)^2 / (b + c), with the continuity correction of Edwards (1948),
    Psychometrika 13(3):185-187, DOI 10.1007/BF02289261. Sign test, Dixon & Mood (1946), JASA
    41(236):557-566, DOI 10.1080/01621459.1946.10501898: wins against wins plus losses, ties
    dropped. Wilcoxon (1945), Biometrics Bulletin 1(6):80-83, DOI 10.2307/3001968: the
    signed-rank test; zero differences dropped, ties get mid-ranks; for up to 50 non-zero
    differences the p-value is exact by counting all sign assignments (dynamic programming
    on twice the ranks, so ties are exact), above that a normal approximation with continuity
    and tie corrections, Hollander, Wolfe & Chicken (2014), ''Nonparametric Statistical
    Methods'', 3rd ed., Wiley, DOI 10.1002/9781119196037. The bootstrap difference resamples
    the pairs (decision D-21). The binomial tail comes from the incomplete beta function of
    decision D-23.'
  needs:
  - CO-1
  alternatives:
  - 'Paired t test: not offered, it is in the TOST function of decision D-28 for equivalence;
    the need names these four.'
  - 'Mid-p exact McNemar: not chosen, it is not conservative-exact; the plain exact test never
    exceeds its level.'
  consequences: 'The exact Wilcoxon p-value equals the enumeration of all 2^n sign assignments
    on random data, with and without ties, and the R example of Hollander & Wolfe (V = 40,
    two-sided p = 0.03906). The McNemar chi-square value matches Agresti''s 63^2 / 236. At 30
    pairs, 1000 repetitions, 5% level: the sign test rejected a true null in 3.1% and a
    shift of 0.6 sd in 69.2%; Wilcoxon 4.7% and 86.3%. The exact tests are conservative, so
    their size is at or below the level.'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-17'
- id: D-30
  text: 'Agreement between raters is measured by three coefficients, each with a percentile
    bootstrap interval that resamples the items or units (decision D-21). Cohen''s kappa for
    two raters, (po - pe) / (1 - pe), Cohen (1960), Educational and Psychological Measurement
    20(1):37-46, DOI 10.1177/001316446002000104, with the linear or quadratic weights of
    Cohen (1968), Psychological Bulletin 70(4):213-220, DOI 10.1037/h0026256, for ordered
    categories. Fleiss'' kappa for a fixed number of raters per item from a table of counts,
    Fleiss (1971), Psychological Bulletin 76(5):378-382, DOI 10.1037/h0031619.
    Krippendorff''s alpha, 1 - Do / De from the coincidence matrix, for any number of raters,
    missing ratings, and nominal, ordinal, interval or ratio differences, Krippendorff (2011),
    ''Computing Krippendorff''s alpha-reliability'', University of Pennsylvania, with the
    bootstrap over units of Krippendorff (2016).'
  needs:
  - CA-3
  alternatives:
  - 'Analytic standard errors of kappa (Fleiss, Cohen & Everitt 1969): not chosen, they exist
    for plain kappa only; one bootstrap serves all three coefficients and the weights.'
  - 'Gwet''s AC1: not offered, the need names the three coefficients.'
  consequences: 'Fleiss'' kappa on the worked example is 0.2099 (published 0.210); Cohen''s
    kappa on the textbook table is 0.4; the weighted kappa matches its definition; alpha
    matches the krippendorff package (nominal 0.7573, ordinal 0.8923, interval 0.8917, ratio
    0.8952 on a 4-rater, 15-unit data set with missing ratings) to 1e-15, checked once outside
    the test suite, and matches the pair-counting definition for nominal data. The interval
    can reach 1.0 when some resamples agree perfectly. Kappa is low when one category is very
    common even if raw agreement is high; the docstring says so.'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-17'
- id: D-31
  text: 'Classifier calibration is read from binned probabilities. Reliability diagram
    numbers (DeGroot & Fienberg 1983, The Statistician 32(1/2):12-22, DOI 10.2307/2987588):
    for each non-empty bin, the count, the mean predicted probability and the share of
    positives. ECE is the bin gaps weighted by bin size and MCE the largest gap, Naeini,
    Cooper & Hauskrecht (2015), AAAI 29(1). The Brier score is split into reliability,
    resolution and uncertainty, Murphy (1973), Journal of Applied Meteorology 12(4):595-600,
    DOI 10.1175/1520-0450(1973)012<0595:ANVPOT>2.0.CO;2, plus the within-bin term that binning
    adds, Stephenson, Coelho & Jolliffe (2008), Weather and Forecasting 23(4):752-757, DOI
    10.1175/2007WAF2006116.1, so that Brier = reliability - resolution + uncertainty +
    within-bin holds exactly. Bins are equal width (default) or equal count.'
  needs:
  - CA-1
  alternatives:
  - 'Debiased or smooth ECE (Kumar et al. 2019, Roelofs et al. 2022): not chosen now, the need
    names ECE and the decomposition; the docstring states the bias.'
  - 'Adaptive bins chosen by a rule: not chosen, the caller picks the number and the cut.'
  consequences: 'The identity holds to 1e-12 on 6 settings. A calibrated forecast on 5000
    items had ECE 0.018 and reliability 0.0004; an overconfident one (logit times 3) had ECE
    0.158 and reliability 0.028. ECE is biased upward with few items: a perfectly calibrated
    classifier with 10 bins has a mean ECE of 0.104 at 100 items, 0.033 at 1000 and 0.010 at
    10000. The within-bin term is small here (about -0.001 to -0.002) and is zero when each bin
    holds one predicted value.'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-17'
- id: D-32
  text: 'A miscalibrated classifier is recalibrated by one of two maps learned on held-out
    scores, both in Rust. Platt scaling, Platt (1999), Advances in Large Margin Classifiers,
    MIT Press: p = 1 / (1 + exp(-(a s + b))) by maximum likelihood on targets smoothed by the
    class counts, with the Newton method and backtracking of Lin, Lin & Weng (2007), Machine
    Learning 68(3):267-276, DOI 10.1007/s10994-007-5018-6. Isotonic regression, Zadrozny &
    Elkan (2002), KDD, DOI 10.1145/775047.775151, by the pool-adjacent-violators algorithm,
    Barlow, Bartholomew, Bremner & Brunk (1972), ''Statistical Inference under Order
    Restrictions'', Wiley, in the linear-time form of Best & Chakravarti (1990),
    Mathematical Programming 47:425-439, DOI 10.1007/BF01580873. Items with the same score are
    pooled first; the isotonic map is linear between the distinct training scores and constant
    outside them.'
  needs:
  - CA-2
  alternatives:
  - 'Temperature scaling and beta calibration: not offered, the need names Platt and isotonic.'
  - 'Isotonic regression as a step function: not chosen, the linear interpolation gives a
    strictly usable ranking between thresholds.'
  consequences: 'On an overconfident classifier (logit three times too large), test ECE fell
    from 0.157 to 0.009 (Platt) and 0.011 (isotonic) with 20000 training items, and the Platt
    slope was 1/3 as expected. With few items isotonic was worse: test Brier at 40 training
    items raw 0.229, Platt 0.207, isotonic 0.223; at 200 items 0.229, 0.203, 0.207; at 1000
    items 0.228, 0.201, 0.202 (60 repetitions each). This is for a sigmoid miscalibration, where
    Platt''s form is right; a non-sigmoid miscalibration favours isotonic. The isotonic fit
    equals the best non-decreasing step fit found by enumerating all partitions (n = 8).'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-17'
- id: D-33
  text: 'The sample of a stratified evaluation set is allocated by the variance of the
    stratified mean, sum of W_h^2 S_h^2 (1/n_h - 1/N_h) with W_h = N_h / N, Cochran (1977),
    ''Sampling Techniques'', 3rd ed., section 5.5, Wiley. Neyman allocation (n_h proportional
    to N_h S_h, and to N_h S_h / sqrt(c_h) with a cost per item), Neyman (1934), Journal of
    the Royal Statistical Society 97(4):558-625, DOI 10.2307/2342192, or proportional
    allocation. The function finds the smallest total, by bisection, whose split meets the
    margin of error z * sqrt(variance) at the stated level; strata that would get more than
    their size are filled and the rest re-split; each stratum gets at least one item. For a
    proportion the planning standard deviation is sqrt(p (1 - p)).'
  needs:
  - DE-3
  alternatives:
  - 'A fixed number per stratum: not chosen, it ignores size and spread.'
  - 'Allocation for several outcomes at once (Cochran 1977, section 5.7 and later):
    not offered now, one outcome per call.'
  consequences: 'For strata of 4000, 2500 and 1000 items with sds 4, 10 and 20 and a margin of
    0.4: Neyman needs 1219 items (320, 499, 400) and proportional 1750 (933, 583, 234). The
    split follows N_h S_h to within 1 percentage point. The planning sds are guesses; if they
    are wrong the achieved margin is too. A population needs at least 2 items per stratum.'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-17'
- id: D-34
  text: 'Planning has three questions per test: power for a sample size, the smallest sample
    size for a power, and the minimum detectable effect for a fixed sample size (found by
    bisection on the power). Paired differences: the t test, power exact from the
    noncentral t distribution, algorithm AS 243, Lenth (1989), Applied Statistics 38(1):185-189,
    DOI 10.2307/2347693, in Rust, Cohen (1988), ''Statistical Power Analysis for the
    Behavioral Sciences'', 2nd ed., chapter 2. Two proportions: the pooled z test, power by the
    normal approximation of Fleiss, Levin & Paik (2003), ''Statistical Methods for Rates and
    Proportions'', 3rd ed., chapter 4, Wiley, DOI 10.1002/0471445428, or by counting every
    outcome of the two binomials (n up to 2000). Equivalence: TOST (decision D-28) against an
    EquivalenceMargin; the paired power is exact, an integral over the sample standard
    deviation of the chance the mean falls inside the shifted margin (the form of Owen (1965),
    Biometrika 52(3-4):437-446, DOI 10.1093/biomet/52.3-4.437), by 200-point Gauss-Legendre
    quadrature; the proportions use the normal approximation of Blackwelder (1982), Controlled
    Clinical Trials 3(4):345-353, DOI 10.1016/0197-2456(82)90024-1.'
  needs:
  - DE-1
  - DE-2
  alternatives:
  - 'Simulation for every power: not chosen, it is slow and noisy; simulation is the check in
    the tests.'
  - 'Sample size for exact two-proportion power: not offered, exact power rises and falls with
    n, so no smallest n is well defined; the sample size is for the approximation.'
  consequences: 'Paired t, effect 0.5 sd, 34 pairs: power 0.8078 (G*Power 0.8077); 34 pairs for
    80%. Two proportions 0.5 against 0.6: 388 per group, approximate power 0.8007, exact count
    0.7956. The paired TOST power matches a simulation of the TOST test within 0.01 (0.6965
    against 0.6892, 0.5834 against 0.5802, 0.1254 against 0.1290, 0.1072 against 0.1060; 6000
    runs each); the 200-point rule differs from a 600-point rule by 1.5e-8. The proportion TOST
    approximation was 0.579 against a simulated 0.548 at 300 per group and rates 0.5 and 0.5
    (margin 0.1), and 0.475 against 0.481 at 500 per group and 0.5 and 0.55, so use it as a
    guide. All planning inputs are guesses; the power is only as good as they are.'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-17'
- id: D-35
  text: 'For a planned number of looks, the critical values keep the overall error rate at
    alpha. Pocock (1977), Biometrika 64(2):191-199, DOI 10.1093/biomet/64.2.191: the same
    critical value at every look. O''Brien-Fleming (1979), Biometrics 35(3):549-556, DOI
    10.2307/2530245: a constant boundary on the scale of the partial sum, so the critical value
    of Z is C / sqrt(t) and very strict early. The constant is found by the recursive
    numerical integration of the Brownian motion, Armitage, McPherson & Rowe (1969), JRSS A
    132(2):235-244, DOI 10.2307/2343787, on an 801-point trapezoid grid per look, with the
    secant method for the constant, as in Jennison & Turnbull (2000), ''Group Sequential
    Methods with Applications to Clinical Trials'', chapter 2, Chapman & Hall/CRC, DOI
    10.1201/9781584888581. The design gives the Z bound, the nominal p-value and the error
    spent at each look. Information times can be unequal; two-sided and one-sided stopping are
    supported.'
  needs:
  - SQ-2
  alternatives:
  - 'Lan-DeMets spending functions (1983), which allow looks at unplanned times: not offered
    now; the need names the two classical boundaries for a fixed number of looks.'
  - 'Haybittle-Peto (fixed 3.0 for interim looks): not offered, it is not in the need.'
  consequences: 'The constants match the published tables: Pocock 2.178, 2.289, 2.361, 2.413
    for 2 to 5 looks, and O''Brien-Fleming 4.562, 3.226, 2.634, 2.281, 2.040 for 5 looks, at a
    two-sided 5%. A simulation of 60000 four-look trials with no effect stopped in 5.0% (both
    designs), against more than 10% when 1.96 is used at every look. The error spent at the
    first of 5 looks is 0.0158 (Pocock) and 0.00001 (O''Brien-Fleming). A design takes about
    1 s. The result is for a normal statistic with known information times.'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-17'
- id: D-36
  text: 'For a continuous look at the data, the caller gets a confidence sequence for a mean and
    an e-process for the claim "the mean is mu0". Method: the normal mixture of Robbins (1970),
    Annals of Mathematical Statistics 41(5):1397-1409, DOI 10.1214/aoms/1177696786, in the form
    of Howard, Ramdas, McAuliffe & Sekhon (2021), Annals of Statistics 49(2):1055-1080, DOI
    10.1214/20-AOS1991, for observations that are sub-Gaussian with a given scale sigma. The
    interval after n observations with sum S is S / n plus or minus sqrt((rho + n sigma^2)
    log((rho + n sigma^2) / (rho alpha^2))) / n. The e-value is sqrt(rho / (rho + n sigma^2))
    exp((S - n mu0)^2 / (2 (rho + n sigma^2))), a mixture of likelihood ratios with expected
    value 1 under the claim. By Ville (1939), the claim is rejected at level alpha when the
    e-value reaches 1 / alpha, with probability at most alpha over all sample sizes (see also
    Ramdas, Grunwald, Vovk & Shafer 2023, Statistical Science 38(4):576-601, DOI
    10.1214/23-STS894). The mixture precision rho is tuned for the sample size n_target
    (default 100); the result stays valid at every size. sigma is an input, not estimated.'
  needs:
  - SQ-1
  alternatives:
  - 'Betting and empirical-Bernstein confidence sequences (Waudby-Smith & Ramdas 2024), which
    do not need sigma for bounded data: not offered now, one method first; they are the next
    step if the sigma assumption is a problem.'
  - 'A fixed-sample interval checked at every look: rejected, it gives a false stop in 48% of
    runs.'
  consequences: 'In 4000 simulated normal paths of 400 observations with no effect, a usual
    95% test checked after every observation stopped in 47.7% of paths. The confidence
    sequence excluded the true mean in 2.8% (at most 5%). The interval is 1.55 times wider
    than the fixed-sample interval at n = 100 and 1.60 times at n = 400: this is the price of
    validity. With a true mean shift of 0.5 standard deviations, the e-process rejected a
    false claim in all of 1000 paths, at a median of 36 observations. The e-value mean under
    the claim is 1 to 1e-6 by numerical integration. The e-value and the interval always
    agree on whether mu0 is rejected. For data in [0, 1], sigma = 0.5 is valid and
    conservative.'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-17'
- id: D-37
  text: 'The caller spends a budget over arms with Beta posteriors by three policies, each from
    its paper. Thompson sampling (Thompson 1933, Biometrika 25(3/4):285-294, DOI
    10.2307/2332286; analysis by Agrawal & Goyal 2012, COLT, PMLR 23:39.1-39.26): draw one value
    from each Beta posterior per pull and pull the arm with the largest draw, so an arm gets
    pulls in proportion to its posterior probability of being best. Bayes-UCB (Kaufmann, Cappe &
    Garivier 2012, AISTATS, PMLR 22:592-600): pull the arm with the largest posterior quantile
    at level 1 - 1 / (t (log n)^c), with c = 0 by default (the value the authors found best in
    experiments; their regret theorem needs c >= 5). Successive halving (Karnin, Koren & Somekh
    2013, ICML, PMLR 28(3):1238-1246): ceil(log2 n) rounds, each surviving arm pulled
    floor(B / (|S_r| ceil(log2 n))) times in round r, the best ceil(|S_r| / 2) arms by that
    round''s success rate kept, the last arm recommended. Beta quantiles and Beta draws use the
    functions already written here in Rust.'
  needs:
  - SQ-3
  alternatives:
  - 'UCB1 (Auer, Cesa-Bianchi & Fischer 2002), which does not use the posterior: not offered,
    the need names policies over Beta posteriors.'
  - 'Cumulative success rate in successive halving: rejected, the paper uses the rate of the
    current round only.'
  consequences: 'Three arms with success probabilities 0.3, 0.5, 0.6 and 1000 pulls, mean over
    20 runs: regret 14.4 for Thompson sampling and 16.0 for Bayes-UCB, against 133 for an even
    split. Against uniform, Thompson gives the second arm 2/3 of the pulls, the exact
    probability. Successive halving over 8 arms (seven at 0.4, one at 0.8) found the best arm in
    54% of 300 runs with a budget of 48 pulls and in 100% with 2000. Thompson sampling and
    Bayes-UCB choose one pull (or a batch, for Thompson) and need the result before the next;
    halving needs a pull function that returns the successes.'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-17'
- id: D-38
  text: 'The caller finds the best arm and stops when it is certain by successive elimination
    (Even-Dar, Mannor & Mansour 2006, JMLR 7:1079-1105, Algorithm 3): every arm in the race is
    pulled each round, and an arm is removed when its empirical mean is more than twice the
    confidence radius below the best, which is the same as its upper end being below the best
    lower end. The radius is the time-uniform radius of D-36 (Howard, Ramdas, McAuliffe &
    Sekhon 2021, Annals of Statistics 49(2):1055-1080) at level delta / K per arm, with sigma =
    0.5 for 0/1 outcomes, in place of the paper''s radius sqrt(ln(c n t^2 / delta) / t) with a
    sum over time. On the event that all K intervals hold at every round, which has probability
    at least 1 - delta by the union bound, the best arm is never removed (its upper end is at
    least its mean, which is at least every other lower end). With epsilon = 0 the rule stops
    when one arm is left and returns the best arm. With epsilon > 0 it also stops when every
    other upper end is at most the leader lower end plus epsilon, and the arm returned is
    within epsilon of the best on the same event (Even-Dar et al., Remark 9, give another
    (epsilon, delta) rule; this one is derived here from the same event). When max_pulls runs
    out the result says confident = False and the guarantee does not apply.'
  needs:
  - SQ-4
  alternatives:
  - 'lil'' UCB (Jamieson, Malloy, Nowak & Bubeck 2014, COLT, PMLR 35:423-439), which spends
    samples on the leading arm and has a smaller sample count: not offered now, one method
    first; the guarantee needs a different stopping rule.'
  - 'Fixed-budget successive halving (D-37): kept as a separate tool, it has no error
    guarantee on the stopping time.'
  consequences: 'Four arms at 0.5, 0.6, 0.45, 0.4 with delta = 0.2 and 300 runs: the best arm
    was returned in all 300 (the bound allows up to 20%), after a mean of 2794 pulls. Four arms
    at 0.50, 0.52, 0.51, 0.30 with delta = 0.1: the exact rule (epsilon = 0) did not stop in
    60000 pulls, and epsilon = 0.1 stopped after a mean of 2746 pulls in 100 runs, always with
    an arm within 0.1 of the best. Four arms at 0.2, 0.4, 0.6, 0.9 stopped after 420 pulls, and
    the worse an arm, the earlier it was removed and the fewer pulls it got (25, 95, 150, 150).
    The intervals are conservative, so the observed error is far below delta.'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-17'
- id: D-39
  text: 'The caller fits a normal, lognormal or shifted exponential distribution from
    sufficient statistics, so the rows are not needed and shards can be merged. Statistics:
    for the normal, the count, the mean and the sum of squared deviations m2, merged by the
    pairwise rule of Chan, Golub & LeVeque (1983), The American Statistician 37(3):242-247, DOI
    10.1080/00031305.1983.10483115; for the lognormal, the same moments of the logarithms; for
    the shifted exponential, the count, the minimum and the mean. The fit is the maximum
    likelihood fit (Casella & Berger 2002, Statistical Inference, 2nd ed., chapter 7): the
    variance is m2 / n, and the shifted exponential has shift = min and rate = n / T with T =
    n (mean - min). With bias_corrected = True the variance is m2 / (n - 1), and the shifted
    exponential uses shift = min - T / (n (n - 1)) and rate = (n - 2) / T, the unbiased
    estimates (Lehmann & Casella 1998, Theory of Point Estimation, 2nd ed., chapter 2): T is
    Gamma(n - 1, rate) and independent of the minimum, so E[1 / T] = rate / (n - 2) and E[min]
    = shift + 1 / (n rate). Each fit has cdf, ppf and sample.'
  needs:
  - DI-1
  alternatives:
  - 'Interval estimates for the parameters: not offered in this step, the need names the
    fit; they follow if the caller asks.'
  - 'Other families (gamma, Weibull): not offered, the need names three.'
  consequences: 'A fit from statistics equals the fit from the rows to 1e-12, and a merge of
    three shards (10, 400 and 37 rows) equals the statistics of the 447 pooled rows to 1e-12.
    For a shifted exponential with shift 10, rate 0.5 and 8 values, in 40000 simulated samples
    the maximum likelihood shift averaged 10.25 (the bias 1 / (n rate)), while the corrected
    shift averaged 10.00 and the corrected rate 0.500 (within 2%). A fit needs at least 2
    values that are not all equal (3 for the corrected shifted exponential).'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-17'
- id: D-40
  text: 'The caller checks goodness of fit on a large N with the test at a stated effective
    sample size, plus total variation distance and Wasserstein distance. The test is Pearson''s
    chi-square test (Pearson 1900, Philosophical Magazine 50(302):157-175, DOI
    10.1080/14786440009463897) on counts, with the statistic n_effective * sum((p_hat - pi)^2 /
    pi), so it equals Pearson''s statistic at n_effective = n, and n and n_effective are both in
    the result. The p-value uses the chi-square distribution, from the regularized incomplete
    gamma function computed here in Rust by the series for x < a + 1 and the Lentz continued
    fraction otherwise (DLMF sections 8.7 and 8.9; Gautschi 1979, ACM TOMS 5(4):466-481, DOI
    10.1145/355853.355863). For continuous data the bins have equal probability under the fit
    and their number is Mann & Wald (1942), Annals of Mathematical Statistics 13(3):306-317, DOI
    10.1214/aoms/1177731569: ceil(4 (2 (n - 1)^2 / z^2)^(1/5)), capped at n / 5 so that each bin
    expects 5 rows (the formula is confirmed from a secondary source, not the paper text). Total
    variation distance is half the sum of absolute differences (Levin, Peres & Wilmer,
    Markov Chains and Mixing Times, proposition 4.2). Wasserstein-1 distance to a fit is the
    integral of |F_n^-1(u) - F^-1(u)| over (0, 1), equal to the area between the distribution
    functions (Vallender 1973, Theory of Probability and its Applications 18(4):784-786, DOI
    10.1137/1118101), computed exactly on each step of the empirical distribution from the
    integral of the quantile function, which has a closed form for the normal, lognormal and
    shifted exponential fits. n_to_reject is the effective sample size at which the same shares
    give p = alpha.'
  needs:
  - DI-2
  alternatives:
  - 'Kolmogorov-Smirnov test against a fitted distribution: not offered, the need asks for a
    test with an effective sample size and the chi-square statistic scales with it directly;
    KS is in DI-3.'
  - 'Wasserstein by the midpoint rule on quantiles: rejected, the exact integral is cheap.'
  consequences: 'The die example (13.4 on 5 df) gives p = 0.0199052203347744 to 1e-10, and the
    incomplete gamma function matches mpmath to 1e-12 at nine (a, x) pairs including an upper
    tail of 1.6e-23. A normal sample of 1,000,000 values with the mean shifted by 3% of a
    standard deviation, tested against the unshifted normal in 946 bins: p = 6e-66, binned total
    variation 0.017 (about 0.012 of it is sampling noise, 0.4 sqrt(n_bins / n)), Wasserstein
    0.0310, n_to_reject 537,000. The same data at n_effective = 1000 (60 bins): p = 1.0. For
    300 lognormal samples of 1000 values drawn from the fit, 6.3% had p < 0.05. The Wasserstein
    distance matches the numeric area between the distribution functions to 2e-5. At 1,000,000
    rows the check takes about 3 s, mostly the normal quantile in Python.'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-17'
- id: D-41
  text: 'The caller compares small timing runs with a Normal-Inverse-Gamma posterior for the mean
    and variance of the log times (Murphy 2007, Conjugate Bayesian analysis of the Gaussian
    distribution; Gelman et al. 2013, Bayesian Data Analysis, 3rd ed., sections 3.2 and 3.3,
    DOI 10.1201/b16018). With n values, mean ybar and sum of squared deviations M2 the posterior
    is kappa + n, (kappa m + n ybar) / (kappa + n), shape + n / 2 and scale + M2 / 2 + kappa n
    (ybar - m)^2 / (2 (kappa + n)). The marginal of the mean is a Student t with 2 shape degrees
    of freedom, so the credible interval is exact (the Rust t quantile) and the object can be
    sampled directly by posterior.compare. The same arithmetic is the intercept-only duration
    model of eta.fit_duration, with kappa = 1 / coef_sd^2. A reference posterior under the prior
    1 / sigma^2 is (ybar, n, (n - 1) / 2, M2 / 2), whose interval is the classical t interval
    (Gelman et al. 2013, section 3.2).'
  needs:
  - BA-7
  alternatives:
  - 'Welch interval (tost) only: kept as the check, it has no probability statements.'
  - 'Bootstrap at n = 5: not offered for this, resamples of 5 values have too few distinct sets.'
  consequences: 'The posterior equals fit_duration for an intercept-only fit to 1e-12, and
    sampled quantiles of the mean match the exact t quantiles to 5e-5. The reference posterior
    covered 95% (within 1.2 points) at n = 5 for noise sd 0.005, 0.02, 0.04 and 0.1 (6000 runs
    each). The informative noise prior of shape 1 and scale 0.02^2 covered 99.8%, 95.3%, 90.9%,
    88.1% and 87.1% at noise sd 0.01, 0.02, 0.03, 0.04 and 0.06: it is not weak at n = 5, and
    under-covers when the true noise is above its own level. For the two example runs (5
    timings each) the reference posterior gives P(B faster) = 0.99 and a speedup interval of
    1.010 to 1.075.'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-18'
