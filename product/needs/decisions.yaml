decisions:
- id: D-1
  text: 'The posterior of the structural time series is computed by the nested Laplace
    approximation over the hyperparameters, Rue, Martino & Chopin (2009), ''Approximate
    Bayesian inference for latent Gaussian models by using integrated nested Laplace
    approximations'', J. R. Stat. Soc. B 71(2):319-392, DOI 10.1111/j.1467-9868.2008.00700.x,
    with Laplace marginals of Tierney & Kadane (1986), JASA 81(393):82-86, DOI 10.1080/01621459.1986.10478240.
    The Laplace draws are corrected by importance sampling, and the fit is accepted
    only when the Pareto-smoothed importance weights pass the k-hat check of Vehtari,
    Simpson, Gelman, Yao & Gabry (2024), ''Pareto smoothed importance sampling'',
    JMLR 25(72). The fit check replaces R-hat: Newton converged at every grid point,
    positive definite Hessian, low grid-edge mass, k-hat <= min(1 - 1/log10(S), 0.7),
    importance-sampling ESS >= 400. A failed check returns no forecast and the reason.'
  needs:
  - TS-1
  - TS-2
  - TS-5
  alternatives:
  - 'NUTS, Hoffman & Gelman (2014), JMLR 15:1593-1623: not chosen for the structural
    series, slow on long count series (TFP docs; a Stan forum thread reports minutes);
    stays the candidate for the general posterior method (BA-4, BA-5), decided separately.'
  - 'Polya-Gamma Gibbs, Polson, Scott & Windle (2013), JASA 108(504):1339-1349: not
    chosen now, exact but needs about 1500-2500 lines of Rust (agent estimate, unverified)
    and has no check beyond R-hat; the fallback if the k-hat failure rate on real
    series is above 5%.'
  - 'Auxiliary mixture sampling, Fruhwirth-Schnatter et al. (2009): not chosen, Windle
    et al. report Polya-Gamma is better at small counts.'
  - 'Durbin-Koopman Gaussian approximation with importance sampling (1997, 2000):
    not chosen, it is the same idea without the hyperparameter grid and without the
    k-hat check.'
  - 'Particle MCMC, Andrieu, Doucet & Holenstein (2010): not chosen, too slow for
    many series.'
  consequences: 'About 5 hyperparameters at most; spike-and-slab priors are not possible
    under this route. A synthetic spike (60 series, T=60, adaptive 21x21 grid) failed
    k-hat 0.7 on 1 of 60 series (2%; a coarse 18x16 grid failed 6 of 60), so the grid
    is adaptive. The Rust fit gives the same posterior trend as the spike (RMSE 0.01-0.03
    between them, 6 series) at about 0.4 s per series. With 2000 draws, 2 of 400 synthetic
    series (T = 60 and 120, mean 0.3 to 30) were refused, both at mean 0.3 and T = 60;
    the 90% band covered the true trend 91-95% of the time. With 800 draws, 6 of 60 spike
    series would have failed ESS >= 400, so the default is 2000 draws. The grid-edge mass limit
    0.02 is about 3 times the largest mass seen in the spike (0.008). Not yet tested on real
    series or against timed NUTS. Switch to Polya-Gamma if more than 5% of real series fail the check.'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-16'
- id: D-2
  text: Conjugate updates (Beta-Binomial, Gamma-Poisson, Normal-Normal with known
    variance, Dirichlet-Multinomial) use the closed forms in Gelman, Carlin, Stern,
    Dunson, Vehtari & Rubin (2013), Bayesian Data Analysis, 3rd ed., CRC Press, DOI
    10.1201/b16018, chapters 2 and 3. Gamma uses the shape-rate form.
  needs:
  - BA-1
  alternatives:
  - 'Numerical posterior (grid or MCMC) for these models: not chosen, the closed form
    is exact and costs nothing.'
  - 'Shape-scale Gamma: not chosen, shape-rate makes the update a plain addition of
    count and exposure.'
  consequences: Only these four pairs are closed form; any other likelihood-prior
    pair goes to the general posterior method (D-1). Normal-Normal needs a known observation
    sd; unknown variance (Normal-Inverse-Gamma) is a separate decision.
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-16'
- id: D-3
  text: 'Bootstrap resamples by a named unit. i.i.d.: Efron (1979), ''Bootstrap methods:
    another look at the jackknife'', Annals of Statistics 7(1):1-26, DOI 10.1214/aos/1176344552.
    Stratified (resample within each stratum, sizes kept) and clustered (resample
    whole clusters): Davison & Hinkley (1997), ''Bootstrap Methods and their Application'',
    chapter 3, Cambridge University Press, DOI 10.1017/CBO9780511802843. Block: the
    moving block bootstrap of Kunsch (1989), ''The jackknife and the bootstrap for
    general stationary observations'', Annals of Statistics 17(3):1217-1241, DOI 10.1214/aos/1176347265.
    Interval: percentile, Efron & Tibshirani (1993), ''An Introduction to the Bootstrap'',
    DOI 10.1201/9780429246593.'
  needs:
  - ES-2
  alternatives:
  - 'Stationary bootstrap (Politis & Romano 1994) for series: not chosen first, the
    fixed block length is easier to state in the result; can be added as another unit.'
  - 'Circular block bootstrap: not chosen, the moving block is the reference method
    and the end effects are small for the series lengths we expect.'
  - 'Two-stage cluster resampling (clusters, then units within): not chosen, single-stage
    keeps within-cluster dependence intact and is what Davison & Hinkley recommend
    when clusters are the sampling unit.'
  consequences: The percentile interval undercovers in small samples; BCa (ES-3) is
    the fix and is a separate decision. The block length is the caller's choice; we
    do not pick it automatically. The statistic runs in Python, so speed is bounded
    by the caller's function; only the resample indices come from Rust.
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-16'
- id: D-4
  text: 'Random numbers come from our own xoshiro256++ generator seeded by SplitMix64:
    Blackman & Vigna (2021), ''Scrambled Linear Pseudorandom Number Generators'',
    ACM Transactions on Mathematical Software 47(4), DOI 10.1145/3460772. Integers
    in [0, n) use the multiply-shift method with rejection: Lemire (2019), ''Fast
    Random Integer Generation in an Interval'', ACM TOMS 45(1), DOI 10.1145/3230636.'
  needs:
  - ES-2
  alternatives:
  - 'The rand crate: not chosen, P-1 asks us to own the generator, and xoshiro256++
    is 30 lines.'
  - 'PCG64 (O''Neill 2014), the NumPy default: not chosen, it needs 128-bit multiplication
    on every draw; xoshiro256++ passes the same test batteries and is faster.'
  - 'Modulo reduction for ranges: not chosen, it is biased when n does not divide
    2^64.'
  consequences: Our streams do not match NumPy's for the same seed; results are reproducible
    within statsx only. The generator is not cryptographic.
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-16'
- id: D-5
  text: 'MCMC convergence uses rank-normalized split R-hat (the maximum of bulk and
    folded R-hat), bulk ESS and tail ESS (the smaller ESS of the 5% and 95% quantile
    indicators) from Vehtari, Gelman, Simpson, Carpenter & Burkner (2021), ''Rank-normalization,
    folding, and localization: An improved R-hat for assessing convergence of MCMC'',
    Bayesian Analysis 16(2):667-718, DOI 10.1214/20-BA1221. The autocorrelation sum
    is truncated by Geyer''s initial monotone sequence, Geyer (1992), ''Practical
    Markov chain Monte Carlo'', Statistical Science 7(4):473-483, DOI 10.1214/ss/1177011137.
    Defaults follow the paper: R-hat at most 1.01, bulk and tail ESS at least 400.
    Any divergent transition fails the check.'
  needs:
  - BA-5
  - TS-5
  alternatives:
  - 'Classic Gelman-Rubin R-hat (Gelman & Rubin 1992): not chosen, it misses chains
    that differ in scale or tails, which the folded and rank-normalized version detects.'
  - 'R-hat threshold 1.05 (the consumer project''s old gate): not chosen as default,
    the paper shows 1.05 passes chains that have not mixed; callers can still pass
    rhat_max=1.05.'
  - 'FFT autocovariance: not chosen, the direct sum stops at the Geyer cutoff, so
    it is short for chains that mix; switch if long, slow-mixing chains make it a
    bottleneck.'
  consequences: Results match ArviZ 0.22 to about 1e-13 on a fixed sample (test).
    Direct autocovariance is O(chains x draws x lags), slow for very long chains that
    mix badly. The check refuses; it never returns a downgraded result.
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-16'
- id: D-6
  text: 'The inverse standard normal CDF is Wichura (1988), ''Algorithm AS 241: The
    percentage points of the normal distribution'', Applied Statistics 37(3):477-484,
    DOI 10.2307/2347330, routine PPND16 (about 16 digits).'
  needs:
  - BA-5
  alternatives:
  - 'Acklam''s approximation: not chosen, about 1e-9 relative accuracy and not a peer-reviewed
    publication.'
  - 'Newton iteration on an erfc implementation: not chosen, slower and needs its
    own erfc first.'
  consequences: Matches mpmath to 1e-12 relative from 1e-300 to 1 - 1e-16 in tests.
    Any later special function (lgamma, digamma, erfc) is its own decision.
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-16'
- id: D-7
  text: 'Task duration is a Bayesian linear regression of log duration on log(1 +
    parameter), with the conjugate Normal-Inverse-Gamma prior: Gelman, Carlin, Stern,
    Dunson, Vehtari & Rubin (2013), Bayesian Data Analysis, 3rd ed., chapter 14, DOI
    10.1201/b16018; O''Hagan & Forster (2004), Kendall''s Advanced Theory of Statistics
    Vol. 2B, 2nd ed., chapter 11. The prediction is the posterior predictive (Student-t
    on the log scale), reported as its median and an equal-tailed interval from 20,000
    exact draws.'
  needs:
  - ET-1
  - ET-2
  alternatives:
  - 'Ordinary least squares with a prediction interval: not chosen, it has no prior,
    so it fails with very few past runs, which is the common case for a new task.'
  - 'Linear model on the raw scale (duration = a + b * files): not chosen, durations
    are positive and their noise grows with the size of the run; the log scale handles
    both.'
  - 'Exact Student-t quantiles: not chosen yet, they need the inverse regularized
    incomplete beta; Monte Carlo error with 20,000 draws is about 1% of the interval
    width.'
  consequences: A coefficient near 1 means duration proportional to that parameter;
    a sum of two costs (per file plus per GB) is approximated by a product of powers.
    Parameters must be >= 0. The interval has Monte Carlo error; it is fixed by the
    seed.
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-16'
- id: D-8
  text: Gamma random variables use Marsaglia & Tsang (2000), 'A simple method for
    generating gamma variables', ACM TOMS 26(3):363-372, DOI 10.1145/358407.358414,
    with their boost for shape < 1. Normal variables use inversion of the CDF with
    AS 241 (D-6).
  needs:
  - ET-2
  alternatives:
  - 'Ziggurat normal sampler (Marsaglia & Tsang 2000b): not chosen, inversion is simpler
    and reuses D-6; switch if sampling speed matters.'
  - 'Ahrens-Dieter gamma sampler: not chosen, more cases and constants for no gain
    in accuracy.'
  consequences: Each normal draw costs one AS 241 call (a log and a sqrt in the tails),
    slower than a ziggurat.
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-16'
- id: D-9
  text: Small dense symmetric positive definite systems use the Cholesky factorization,
    Golub & Van Loan (2013), 'Matrix Computations', 4th ed., Johns Hopkins University
    Press, ISBN 978-1-4214-0794-4, section 4.2.
  needs:
  - ET-1
  alternatives:
  - 'LAPACK through a Rust binding: not chosen, it adds a native library to every
    wheel for matrices of size 2 to 10.'
  - 'QR on the design matrix: not chosen, more stable for ill-conditioned designs,
    but the prior adds 1/coef_var to the diagonal, which keeps the normal equations
    well conditioned.'
  consequences: 'O(p^3) and unblocked: fine for a handful of parameters, not for large
    models (D-1 brings its own banded factor).'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-16'
- id: D-10
  text: 'log-gamma uses the Lanczos approximation with g = 7 and 9 coefficients (Godfrey''s
    set), Lanczos (1964), ''A precision approximation of the gamma function'', SIAM
    J. Numer. Anal. Ser. B 1:86-96, DOI 10.1137/0701008, with the reflection formula
    below 0.5. Digamma uses the recurrence up to x >= 12 and the asymptotic series,
    Bernardo (1976), ''Algorithm AS 103: Psi (digamma) function'', Applied Statistics
    25(3):315-317, DOI 10.2307/2347257, with Bernoulli terms up to x^-12 instead of
    AS 103''s three.'
  needs:
  - TS-1
  alternatives:
  - 'Stirling series for log-gamma with a recurrence shift: not chosen, Lanczos reaches
    1e-15 with one fixed formula.'
  - 'AS 103 as published (shift to 8.5, three series terms): not chosen, it gives
    about 1e-9; the extra terms give 1e-14.'
  consequences: Both match mpmath to 1e-13 relative from 1e-8 to 1e5 in tests. Defined
    for x > 0 only; NaN otherwise.
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-16'
- id: D-11
  text: The count likelihood is the negative binomial in the NB2 form (mean mu = exp(eta),
    Var = mu + mu^2 / alpha), Cameron & Trivedi (2013), 'Regression Analysis of Count
    Data', 2nd ed., chapter 3, Cambridge University Press, DOI 10.1017/CBO9781139013567.
    It is written on the log-mean scale eta with closed-form first and second derivatives
    in eta and the first derivative in alpha. The model sets alpha = 1 / (phi^2 +
    1e-3), as in the consumer project's earlier NumPyro model, so old and new fits
    are comparable.
  needs:
  - TS-1
  - TS-2
  alternatives:
  - 'NB1 (Var = mu (1 + delta)): not chosen, the earlier model is NB2 and NB2 is the
    usual form for overdispersed event counts.'
  - 'Poisson only: not chosen, natural event counts are overdispersed; Poisson is
    the limit alpha -> infinity and stays available.'
  consequences: The log-likelihood is concave in eta for fixed alpha (tested), which
    the D-1 Newton step relies on. Derivatives are checked against finite differences.
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-16'
- id: D-12
  text: 'A forecast continues each posterior draw: the drift extends as a Gaussian random
    walk with that draw''s sigma, the fixed effects (level, slope, Fourier season) are
    evaluated at the future months, and a new count is drawn from the negative binomial
    with that draw''s dispersion. This is forecasting a state space model by simulating
    the state forward, Durbin & Koopman (2012), ''Time Series Analysis by State Space
    Methods'', 2nd ed., chapter 4, Oxford University Press, DOI 10.1093/acprof:oso/9780199641178.001.0001.
    Bands are central quantiles of the draws at 50%, 80% and 95%, nested by construction.
    The Python layer draws with NumPy''s Generator (PCG64), seeded by the caller.'
  needs:
  - TS-2
  - TS-4
  alternatives:
  - 'Closed-form Gaussian forecast variance: not chosen, the count likelihood is not
    Gaussian and the draws already carry the uncertainty of sigma and the level.'
  - 'Our own Rust sampler for the forecast draws: not chosen now, the cost is small
    (2000 x 72 values) and NumPy is the allowed run-time dependency.'
  consequences: 'The trend band widens with the horizon (80% width 0.56, 0.77, 0.98 at
    1, 6 and 12 months ahead on synthetic series of mean 30). On 12 held-out months of
    synthetic series of mean 30, 95% bands covered 96% and 80% bands 82%. At mean 1 and
    5 the bands over-cover (80% bands covered 94% and 88%) because a count is an integer
    and because the half-normal(0.2) prior on sigma is wider than the true drift at 60
    months. The season repeats and the slope continues unchanged.'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-17'
- id: D-13
  text: 'An observed month is flagged as an anomaly when its count lies outside the
    central 95% band of the posterior predictive distribution of a new count for that
    month, given the trend and the season. This is a posterior predictive check, Gelman,
    Carlin, Stern, Dunson, Vehtari & Rubin (2013), ''Bayesian Data Analysis'', 3rd ed.,
    chapter 6, CRC Press, DOI 10.1201/b16018. The report gives the band, the observed
    count and the direction (below or above) for every month.'
  needs:
  - TS-4
  alternatives:
  - 'Leave-one-out predictive intervals (PSIS-LOO, Vehtari, Gelman & Gabry 2017): not
    chosen now, the in-sample band is simpler and the Laplace draws would need a
    second importance step; the in-sample band is conservative.'
  - 'A p-value from a test statistic: not chosen, the need asks for the band the model
    expected, and the project reports posteriors, not p-values.'
  consequences: 'The fit has seen the month it checks, so a large outlier can pull the
    trend and the band toward itself; the flags are conservative. On synthetic series
    with no outlier (60 months, 30 series each) 0.7% of months were flagged at mean 3 and
    1.4% at mean 30, below the nominal 5%. At mean 30 with strong overdispersion (size 5)
    a count of twice the expected value was flagged 33% of the time and four times the
    expected value 73% of the time.'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-17'
- id: D-14
  text: 'Regressor terms enter the log mean as fixed coefficients in the latent field,
    next to the level, slope and Fourier season, as in a structural time series with
    explanatory variables, Harvey (1989), ''Forecasting, Structural Time Series Models
    and the Kalman Filter'', Cambridge University Press, DOI 10.1017/CBO9781107049994.
    Each regressor is standardized (mean 0, sd 1) and its coefficient has a N(0, 1)
    prior. The Poisson likelihood is the limit of the negative binomial as alpha goes
    to infinity (Cameron & Trivedi 2013, chapter 3, as in D-11): it has no dispersion
    parameter, so the hyperparameter grid has one dimension. The season period and the
    number of harmonics are arguments.'
  needs:
  - TS-6
  - TS-7
  alternatives:
  - 'Regressor coefficients that follow a random walk (time-varying effects): not chosen,
    the caller asked for regressor terms, and a constant effect keeps the Laplace
    approximation to about 2 hyperparameters.'
  - 'Poisson as a negative binomial with a fixed large alpha: not chosen, it is not
    exact and the Poisson derivatives are simpler.'
  consequences: 'A Poisson fit of overdispersed counts puts the extra variance into the
    random-walk drift: on synthetic series (mean 30, size 3) the drift sd was 0.7-0.9
    against a true 0.04, and the trend error 0.5-0.7 against 0.1 for the negative binomial.
    The trend of such a fit is not free of noise, so the negative binomial is the default.
    A regressor effect is separate from the trend: the trend is level + slope + drift,
    and a forecast needs the regressors for the forecast months.'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-17'
- id: D-15
  text: 'The effect of an intervention is the observed count minus the counterfactual,
    where the counterfactual is the posterior predictive count of the structural series
    fitted on the months before the intervention with the control series as regressors
    (decision D-14), forecast over the months after it with the controls'' values,
    Brodersen, Gallusser, Koehler, Remy & Scott (2015), ''Inferring causal impact using
    Bayesian structural time-series models'', Annals of Applied Statistics 9(1):247-274,
    DOI 10.1214/14-AOAS788. Controls enter as log(1 + count). The result gives the
    effect for each month, the cumulative and the average effect as an Estimate with
    its interval and its assumption, and P(cumulative effect > 0).'
  needs:
  - TS-7
  alternatives:
  - 'Spike-and-slab selection of controls, as in the paper: not chosen, the latent
    prior must be Gaussian under decision D-1; every control gets a N(0, 1) prior on its
    standardized coefficient, so many weak controls dilute the fit.'
  - 'Difference-in-differences or synthetic control: not chosen, the maintainer asked
    for the Bayesian structural route with a posterior of the effect.'
  consequences: 'The data cannot check that the controls are unaffected by the
    intervention; the result states that assumption. On synthetic series (60 months,
    intervention at 48, 3 controls, 40 series per row, drift prior scale 0.05) the 95%
    cumulative interval excluded 0 in 10% of series with no effect, in 3% with a 10% effect
    and in 33% with a 30% effect (P(effect > 0) above 0.95 in 45%): the power is low for
    12 post months and noisy counts. The mean cumulative estimate was 154 against a true 168
    at a 30% effect, and -5 against 0 with no effect. With the default drift prior scale
    0.2 the power at 30% was 10%.'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-17'
- id: D-16
  text: 'A forecast is backtested with rolling origins: at each origin the model is
    refitted on the months before it and forecasts the next months, Tashman (2000),
    ''Out-of-sample tests of forecasting accuracy: an analysis and review'', International
    Journal of Forecasting 16(4):437-450, DOI 10.1016/S0169-2070(00)00065-0. The forecast
    draws are scored with the CRPS, estimated from the draws as E|X - y| - E|X - X''|/2
    (sorted-draws form), a strictly proper score, Gneiting & Raftery (2007), JASA
    102(477):359-378, DOI 10.1198/016214506000001437, and with the share of observed
    counts inside the 50%, 80% and 95% bands. An origin whose fit fails the fit check is
    counted as refused and reported, never dropped; every series given is reported.'
  needs:
  - TS-8
  alternatives:
  - 'A single train/test split: not chosen, one origin cannot show how the score changes
    with the forecast horizon or the season.'
  - 'Log score: not chosen, the draws give no density for counts without an extra
    smoothing step, and the CRPS is in the units of the counts.'
  consequences: 'The result carries the refused origins, so a method that refuses hard
    series cannot look better than one that forecasts them. Reporting all series follows
    Roque, Cerqueira, Soares & Torgo (2025), AAAI 39(19):20192-20199, who show that a
    choice of 4 datasets lets 46% of methods look best. On 10 synthetic series (96 months,
    horizon 6, origins every 6 months from 48; 80 origins, none refused) the bands covered
    54% (50% band), 81% (80%) and 96% (95%) of the counts, per series 44-62%, 65-92% and
    92-98%. The cost is one refit per origin: about 0.4 s each.'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-17'
- id: D-17
  text: 'A finished run is added to a duration model by the one-observation conjugate
    update of the Normal-Inverse-Gamma regression of decision D-7: with row x and
    log duration y, s = 1 + x^T V x and r = y - x^T m, the posterior is m + V x r / s,
    V - V x x^T V / s, shape + 1/2 and rate + r^2 / (2 s). This is recursive Bayesian
    least squares with a conjugate prior, Gelman, Carlin, Stern, Dunson, Vehtari & Rubin
    (2013), ''Bayesian Data Analysis'', 3rd ed., chapter 14, CRC Press, DOI 10.1201/b16018.'
  needs:
  - ET-4
  alternatives:
  - 'Refit from all past runs: not chosen, it needs every past run and costs more with
    each run; the update is exact, so nothing is lost.'
  - 'Exponential forgetting of old runs: not chosen now, the model assumes the process
    does not change; forgetting is a separate decision if durations drift.'
  consequences: 'The update gives the same model as a refit from all runs up to rounding
    (1e-9 relative, tested on 35 sequential updates). It keeps no past run, so it cannot
    detect that the process changed.'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-17'
- id: D-18
  text: 'When a parameter is unknown before a run, the duration model is refitted on the
    past runs with only the known parameters, and that model predicts. What the unknown
    parameter explained goes into the noise term, so the predictive interval is wider.
    The model keeps the past runs for this. Each model with a subset of the columns is
    the Normal-Inverse-Gamma regression of decision D-7, Gelman, Carlin, Stern, Dunson,
    Vehtari & Rubin (2013), ''Bayesian Data Analysis'', 3rd ed., chapter 14, CRC Press,
    DOI 10.1201/b16018.'
  needs:
  - ET-5
  alternatives:
  - 'Integrate over the unknown parameter using its past values: not chosen, it ignores
    that the unknown parameter is correlated with the known ones (files and size), and
    the subset regression uses that correlation.'
  - 'Fill the unknown value with its past mean: not chosen, it gives a narrow interval
    that does not say the value was unknown.'
  consequences: 'On synthetic runs (duration = 0.2 files + 5 GB, log-normal noise sd 0.2,
    300 past runs) the ratio upper/lower of the 90% interval was 2.5 with both parameters,
    2.7 with files only and 8.1 with none; coverage of 300 new runs was 92%, 90% and 91%.
    The refit costs one closed-form fit per prediction. A model keeps its past runs in
    memory, and a parameter that is unknown now but was always known before is assumed to
    relate to the others as in the past.'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-17'
