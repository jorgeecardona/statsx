decisions:
- id: D-1
  text: 'The posterior of the structural time series is computed by the nested Laplace
    approximation over the hyperparameters, Rue, Martino & Chopin (2009), ''Approximate
    Bayesian inference for latent Gaussian models by using integrated nested Laplace
    approximations'', J. R. Stat. Soc. B 71(2):319-392, DOI 10.1111/j.1467-9868.2008.00700.x,
    with Laplace marginals of Tierney & Kadane (1986), JASA 81(393):82-86, DOI 10.1080/01621459.1986.10478240.
    The Laplace draws are corrected by importance sampling, and the fit is accepted
    only when the Pareto-smoothed importance weights pass the k-hat check of Vehtari,
    Simpson, Gelman, Yao & Gabry (2024), ''Pareto smoothed importance sampling'',
    JMLR 25(72). The fit check replaces R-hat: Newton converged at every grid point,
    positive definite Hessian, low grid-edge mass, k-hat <= min(1 - 1/log10(S), 0.7),
    importance-sampling ESS >= 400. A failed check returns no forecast and the reason.'
  needs:
  - TS-1
  - TS-2
  - TS-5
  alternatives:
  - 'NUTS, Hoffman & Gelman (2014), JMLR 15:1593-1623: not chosen for the structural
    series, slow on long count series (TFP docs; a Stan forum thread reports minutes);
    stays the candidate for the general posterior method (BA-4, BA-5), decided separately.'
  - 'Polya-Gamma Gibbs, Polson, Scott & Windle (2013), JASA 108(504):1339-1349: not
    chosen now, exact but needs about 1500-2500 lines of Rust (agent estimate, unverified)
    and has no check beyond R-hat; the fallback if the k-hat failure rate on real
    series is above 5%.'
  - 'Auxiliary mixture sampling, Fruhwirth-Schnatter et al. (2009): not chosen, Windle
    et al. report Polya-Gamma is better at small counts.'
  - 'Durbin-Koopman Gaussian approximation with importance sampling (1997, 2000):
    not chosen, it is the same idea without the hyperparameter grid and without the
    k-hat check.'
  - 'Particle MCMC, Andrieu, Doucet & Holenstein (2010): not chosen, too slow for
    many series.'
  consequences: 'About 5 hyperparameters at most; spike-and-slab priors are not possible
    under this route. A synthetic spike (60 series, T=60, adaptive 21x21 grid) failed
    k-hat 0.7 on 1 of 60 series (2%; a coarse 18x16 grid failed 6 of 60), so the grid
    is adaptive. Not yet tested on real series, T=120, or against timed NUTS. Switch
    to Polya-Gamma if more than 5% of real series fail the check.'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-16'
- id: D-2
  text: Conjugate updates (Beta-Binomial, Gamma-Poisson, Normal-Normal with known
    variance, Dirichlet-Multinomial) use the closed forms in Gelman, Carlin, Stern,
    Dunson, Vehtari & Rubin (2013), Bayesian Data Analysis, 3rd ed., CRC Press, DOI
    10.1201/b16018, chapters 2 and 3. Gamma uses the shape-rate form.
  needs:
  - BA-1
  alternatives:
  - 'Numerical posterior (grid or MCMC) for these models: not chosen, the closed form
    is exact and costs nothing.'
  - 'Shape-scale Gamma: not chosen, shape-rate makes the update a plain addition of
    count and exposure.'
  consequences: Only these four pairs are closed form; any other likelihood-prior
    pair goes to the general posterior method (D-1). Normal-Normal needs a known observation
    sd; unknown variance (Normal-Inverse-Gamma) is a separate decision.
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-16'
- id: D-3
  text: 'Bootstrap resamples by a named unit. i.i.d.: Efron (1979), ''Bootstrap methods:
    another look at the jackknife'', Annals of Statistics 7(1):1-26, DOI 10.1214/aos/1176344552.
    Stratified (resample within each stratum, sizes kept) and clustered (resample
    whole clusters): Davison & Hinkley (1997), ''Bootstrap Methods and their Application'',
    chapter 3, Cambridge University Press, DOI 10.1017/CBO9780511802843. Block: the
    moving block bootstrap of Kunsch (1989), ''The jackknife and the bootstrap for
    general stationary observations'', Annals of Statistics 17(3):1217-1241, DOI 10.1214/aos/1176347265.
    Interval: percentile, Efron & Tibshirani (1993), ''An Introduction to the Bootstrap'',
    DOI 10.1201/9780429246593.'
  needs:
  - ES-2
  alternatives:
  - 'Stationary bootstrap (Politis & Romano 1994) for series: not chosen first, the
    fixed block length is easier to state in the result; can be added as another unit.'
  - 'Circular block bootstrap: not chosen, the moving block is the reference method
    and the end effects are small for the series lengths we expect.'
  - 'Two-stage cluster resampling (clusters, then units within): not chosen, single-stage
    keeps within-cluster dependence intact and is what Davison & Hinkley recommend
    when clusters are the sampling unit.'
  consequences: The percentile interval undercovers in small samples; BCa (ES-3) is
    the fix and is a separate decision. The block length is the caller's choice; we
    do not pick it automatically. The statistic runs in Python, so speed is bounded
    by the caller's function; only the resample indices come from Rust.
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-16'
- id: D-4
  text: 'Random numbers come from our own xoshiro256++ generator seeded by SplitMix64:
    Blackman & Vigna (2021), ''Scrambled Linear Pseudorandom Number Generators'',
    ACM Transactions on Mathematical Software 47(4), DOI 10.1145/3460772. Integers
    in [0, n) use the multiply-shift method with rejection: Lemire (2019), ''Fast
    Random Integer Generation in an Interval'', ACM TOMS 45(1), DOI 10.1145/3230636.'
  needs:
  - ES-2
  alternatives:
  - 'The rand crate: not chosen, P-1 asks us to own the generator, and xoshiro256++
    is 30 lines.'
  - 'PCG64 (O''Neill 2014), the NumPy default: not chosen, it needs 128-bit multiplication
    on every draw; xoshiro256++ passes the same test batteries and is faster.'
  - 'Modulo reduction for ranges: not chosen, it is biased when n does not divide
    2^64.'
  consequences: Our streams do not match NumPy's for the same seed; results are reproducible
    within statsx only. The generator is not cryptographic.
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-16'
- id: D-5
  text: 'MCMC convergence uses rank-normalized split R-hat (the maximum of bulk and
    folded R-hat), bulk ESS and tail ESS (the smaller ESS of the 5% and 95% quantile
    indicators) from Vehtari, Gelman, Simpson, Carpenter & Burkner (2021), ''Rank-normalization,
    folding, and localization: An improved R-hat for assessing convergence of MCMC'',
    Bayesian Analysis 16(2):667-718, DOI 10.1214/20-BA1221. The autocorrelation sum
    is truncated by Geyer''s initial monotone sequence, Geyer (1992), ''Practical
    Markov chain Monte Carlo'', Statistical Science 7(4):473-483, DOI 10.1214/ss/1177011137.
    Defaults follow the paper: R-hat at most 1.01, bulk and tail ESS at least 400.
    Any divergent transition fails the check.'
  needs:
  - BA-5
  - TS-5
  alternatives:
  - 'Classic Gelman-Rubin R-hat (Gelman & Rubin 1992): not chosen, it misses chains
    that differ in scale or tails, which the folded and rank-normalized version detects.'
  - 'R-hat threshold 1.05 (the consumer project''s old gate): not chosen as default,
    the paper shows 1.05 passes chains that have not mixed; callers can still pass
    rhat_max=1.05.'
  - 'FFT autocovariance: not chosen, the direct sum stops at the Geyer cutoff, so
    it is short for chains that mix; switch if long, slow-mixing chains make it a
    bottleneck.'
  consequences: Results match ArviZ 0.22 to about 1e-13 on a fixed sample (test).
    Direct autocovariance is O(chains x draws x lags), slow for very long chains that
    mix badly. The check refuses; it never returns a downgraded result.
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-16'
- id: D-6
  text: 'The inverse standard normal CDF is Wichura (1988), ''Algorithm AS 241: The
    percentage points of the normal distribution'', Applied Statistics 37(3):477-484,
    DOI 10.2307/2347330, routine PPND16 (about 16 digits).'
  needs:
  - BA-5
  alternatives:
  - 'Acklam''s approximation: not chosen, about 1e-9 relative accuracy and not a peer-reviewed
    publication.'
  - 'Newton iteration on an erfc implementation: not chosen, slower and needs its
    own erfc first.'
  consequences: Matches mpmath to 1e-12 relative from 1e-300 to 1 - 1e-16 in tests.
    Any later special function (lgamma, digamma, erfc) is its own decision.
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-16'
- id: D-7
  text: 'Task duration is a Bayesian linear regression of log duration on log(1 +
    parameter), with the conjugate Normal-Inverse-Gamma prior: Gelman, Carlin, Stern,
    Dunson, Vehtari & Rubin (2013), Bayesian Data Analysis, 3rd ed., chapter 14, DOI
    10.1201/b16018; O''Hagan & Forster (2004), Kendall''s Advanced Theory of Statistics
    Vol. 2B, 2nd ed., chapter 11. The prediction is the posterior predictive (Student-t
    on the log scale), reported as its median and an equal-tailed interval from 20,000
    exact draws.'
  needs:
  - ET-1
  - ET-2
  alternatives:
  - 'Ordinary least squares with a prediction interval: not chosen, it has no prior,
    so it fails with very few past runs, which is the common case for a new task.'
  - 'Linear model on the raw scale (duration = a + b * files): not chosen, durations
    are positive and their noise grows with the size of the run; the log scale handles
    both.'
  - 'Exact Student-t quantiles: not chosen yet, they need the inverse regularized
    incomplete beta; Monte Carlo error with 20,000 draws is about 1% of the interval
    width.'
  consequences: A coefficient near 1 means duration proportional to that parameter;
    a sum of two costs (per file plus per GB) is approximated by a product of powers.
    Parameters must be >= 0. The interval has Monte Carlo error; it is fixed by the
    seed.
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-16'
- id: D-8
  text: Gamma random variables use Marsaglia & Tsang (2000), 'A simple method for
    generating gamma variables', ACM TOMS 26(3):363-372, DOI 10.1145/358407.358414,
    with their boost for shape < 1. Normal variables use inversion of the CDF with
    AS 241 (D-6).
  needs:
  - ET-2
  alternatives:
  - 'Ziggurat normal sampler (Marsaglia & Tsang 2000b): not chosen, inversion is simpler
    and reuses D-6; switch if sampling speed matters.'
  - 'Ahrens-Dieter gamma sampler: not chosen, more cases and constants for no gain
    in accuracy.'
  consequences: Each normal draw costs one AS 241 call (a log and a sqrt in the tails),
    slower than a ziggurat.
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-16'
- id: D-9
  text: Small dense symmetric positive definite systems use the Cholesky factorization,
    Golub & Van Loan (2013), 'Matrix Computations', 4th ed., Johns Hopkins University
    Press, ISBN 978-1-4214-0794-4, section 4.2.
  needs:
  - ET-1
  alternatives:
  - 'LAPACK through a Rust binding: not chosen, it adds a native library to every
    wheel for matrices of size 2 to 10.'
  - 'QR on the design matrix: not chosen, more stable for ill-conditioned designs,
    but the prior adds 1/coef_var to the diagonal, which keeps the normal equations
    well conditioned.'
  consequences: 'O(p^3) and unblocked: fine for a handful of parameters, not for large
    models (D-1 brings its own banded factor).'
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-16'
- id: D-10
  text: 'log-gamma uses the Lanczos approximation with g = 7 and 9 coefficients (Godfrey''s
    set), Lanczos (1964), ''A precision approximation of the gamma function'', SIAM
    J. Numer. Anal. Ser. B 1:86-96, DOI 10.1137/0701008, with the reflection formula
    below 0.5. Digamma uses the recurrence up to x >= 12 and the asymptotic series,
    Bernardo (1976), ''Algorithm AS 103: Psi (digamma) function'', Applied Statistics
    25(3):315-317, DOI 10.2307/2347257, with Bernoulli terms up to x^-12 instead of
    AS 103''s three.'
  needs:
  - TS-1
  alternatives:
  - 'Stirling series for log-gamma with a recurrence shift: not chosen, Lanczos reaches
    1e-15 with one fixed formula.'
  - 'AS 103 as published (shift to 8.5, three series terms): not chosen, it gives
    about 1e-9; the extra terms give 1e-14.'
  consequences: Both match mpmath to 1e-13 relative from 1e-8 to 1e5 in tests. Defined
    for x > 0 only; NaN otherwise.
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-16'
- id: D-11
  text: The count likelihood is the negative binomial in the NB2 form (mean mu = exp(eta),
    Var = mu + mu^2 / alpha), Cameron & Trivedi (2013), 'Regression Analysis of Count
    Data', 2nd ed., chapter 3, Cambridge University Press, DOI 10.1017/CBO9781139013567.
    It is written on the log-mean scale eta with closed-form first and second derivatives
    in eta and the first derivative in alpha. The model sets alpha = 1 / (phi^2 +
    1e-3), as in the consumer project's earlier NumPyro model, so old and new fits
    are comparable.
  needs:
  - TS-1
  - TS-2
  alternatives:
  - 'NB1 (Var = mu (1 + delta)): not chosen, the earlier model is NB2 and NB2 is the
    usual form for overdispersed event counts.'
  - 'Poisson only: not chosen, natural event counts are overdispersed; Poisson is
    the limit alpha -> infinity and stays available.'
  consequences: The log-likelihood is concave in eta for fixed alpha (tested), which
    the D-1 Newton step relies on. Derivatives are checked against finite differences.
  principles:
  - P-1
  - P-2
  decided_at: '2026-11-16'
