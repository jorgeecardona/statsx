who: caller running an experiment that may stop early

needs:

  - id: SQ-1
    text: >
      When the caller watches an evaluation continuously, they can get always-valid inference
      (e-values, confidence sequences), so stopping early does not inflate the error rate.
    sources:
      - {kind: secondary, date: 2026-11-12, locator: "design draft from a consumer project (private, not linked)"}
    proofs:
      - "test:tests/test_alwaysvalid.py::test_the_confidence_sequence_holds_the_true_mean_at_every_step_with_probability_one_minus_alpha"
      - "test:tests/test_alwaysvalid.py::test_looking_after_every_observation_with_a_usual_interval_is_far_above_five_percent"
      - "test:tests/test_alwaysvalid.py::test_the_e_value_rejects_a_true_claim_at_most_alpha_of_the_time_whenever_you_stop"
      - "test:tests/test_alwaysvalid.py::test_a_false_claim_is_rejected_early_and_the_interval_excludes_it_at_the_same_step"

  - id: SQ-2
    text: >
      When the caller plans a fixed number of looks, they can get O'Brien-Fleming or Pocock boundaries.
    sources:
      - {kind: secondary, date: 2026-11-12, locator: "design draft from a consumer project (private, not linked)"}
    proofs:
      - "test:tests/test_groupsequential.py::test_pocock_constants_match_the_published_table"
      - "test:tests/test_groupsequential.py::test_obrien_fleming_bounds_match_the_published_values_for_five_looks"
      - "test:tests/test_groupsequential.py::test_a_simulation_of_the_stopping_rule_has_the_stated_error_rate"

  - id: SQ-3
    text: >
      When the caller allocates a budget over arms, they can get Thompson sampling, UCB, or successive
      halving over Beta posteriors.
    sources:
      - {kind: secondary, date: 2026-11-12, locator: "design draft from a consumer project (private, not linked)"}
    proofs:
      - "test:tests/test_bandit.py::test_thompson_gives_each_arm_pulls_in_proportion_to_its_chance_of_being_best"
      - "test:tests/test_bandit.py::test_bayes_ucb_index_is_the_posterior_quantile_at_the_stated_level"
      - "test:tests/test_bandit.py::test_the_halving_schedule_follows_the_paper"
      - "test:tests/test_bandit.py::test_more_budget_finds_the_best_arm_more_often"

  - id: SQ-4
    text: >
      When the caller must pick the best candidate, they can get best-arm identification with a
      stopping guarantee.
    sources:
      - {kind: secondary, date: 2026-11-12, locator: "design draft from a consumer project (private, not linked)"}
    proofs:
      - "test:tests/test_identify.py::test_the_arm_returned_is_the_best_arm_with_probability_at_least_one_minus_delta"
      - "test:tests/test_identify.py::test_an_epsilon_guarantee_returns_an_arm_within_epsilon_of_the_best"
      - "test:tests/test_identify.py::test_two_equal_arms_run_out_of_budget_and_the_result_says_no_guarantee"
