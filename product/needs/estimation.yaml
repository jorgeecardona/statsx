who: caller estimating a quantity with its uncertainty

needs:

  - id: ES-1
    text: >
      When the caller needs an interval for a proportion, they can pick Wilson, Jeffreys,
      Clopper-Pearson, or Agresti-Coull, and the docs state the small-N behaviour of each.
    sources:
      - {kind: secondary, date: 2026-11-12, locator: "design draft from a consumer project (private, not linked)"}

  - id: ES-2
    text: >
      When the caller bootstraps, they can name the resample unit (i.i.d., stratified, clustered,
      block), and the result records that unit.
    sources:
      - {kind: secondary, date: 2026-11-12, locator: "design draft from a consumer project (private, not linked)"}
    must: true
    proofs:
      - "test:tests/test_bootstrap.py::test_the_result_records_the_resample_unit_for_each_of_the_four_units"

  - id: ES-3
    text: >
      When the caller bootstraps, they can get percentile, basic, or BCa intervals.
    sources:
      - {kind: secondary, date: 2026-11-12, locator: "design draft from a consumer project (private, not linked)"}
    proofs:
      - "test:tests/test_bootstrap.py::test_the_basic_interval_reflects_the_percentile_interval_around_the_estimate"
      - "test:tests/test_bootstrap.py::test_the_bca_interval_follows_its_definition"
      - "test:tests/test_bootstrap.py::test_bca_with_clusters_drops_one_cluster_at_a_time"

  - id: ES-4
    text: >
      When the caller has posterior draws, they can get quantiles, a highest density interval, and a
      credible interval from one function each.
    sources:
      - {kind: secondary, date: 2026-11-12, locator: "design draft from a consumer project (private, not linked)"}
    proofs:
      - "test:tests/test_posterior.py::test_quantiles_are_one_call_and_match_linear_interpolation"
      - "test:tests/test_posterior.py::test_credible_interval_has_equal_tails"
      - "test:tests/test_posterior.py::test_hdi_is_the_shortest_interval_with_the_stated_mass"

  - id: ES-5
    text: >
      When the caller computes an effect size, they can get it with an interval, not a point estimate
      only.
    sources:
      - {kind: secondary, date: 2026-11-12, locator: "design draft from a consumer project (private, not linked)"}

  - id: ES-6
    text: >
      When the caller gets any result, they can read the estimate, the interval, the sample size, and
      the assumption made as fields of a frozen dataclass.
    sources:
      - {kind: secondary, date: 2026-11-12, locator: "design draft from a consumer project (private, not linked)"}
    must: true
    proofs:
      - "test:tests/test_result.py::test_estimate_exposes_estimate_interval_n_and_assumption_as_frozen_fields"
