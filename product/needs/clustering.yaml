who: caller with points in a feature space (embeddings, measurements) and no labels

needs:

  - id: CL-1
    text: >
      When the caller has unlabelled points, they can split them into k clusters by k-means, choose
      k with a stated criterion, and see which points sit between clusters, with no library besides
      NumPy and a fit that does not change with the thread count.
    sources:
      - {kind: primary, date: 2026-11-21, who: maintainer, quote: "kmeans is obviously stats so it should be in statsx and then emeans aswell and then by extension hdbscan and so on no?"}
      - {kind: primary, date: 2026-11-21, who: maintainer, quote: "the umap implementations and kmeans emeans and so on can be implemented completeetly in statx without external needs and without extra installation required"}
    proofs:
      - "test:tests/test_clustering.py::test_planted_clusters_are_found_and_the_fit_is_consistent"
      - "test:tests/test_clustering.py::test_the_fit_reaches_the_best_partition_on_a_small_set"
      - "test:tests/test_clustering.py::test_the_result_does_not_depend_on_the_number_of_threads"
      - "test:tests/test_clustering.py::test_the_silhouette_equals_the_definition"
      - "test:tests/test_clustering.py::test_the_gap_statistic_finds_three_clusters"
      - "test:tests/test_clustering.py::test_the_gap_statistic_says_one_for_uniform_data_most_of_the_time"
    must: false

  - id: CL-2
    text: >
      When the caller has unlabelled points whose groups are stretched or overlap, they can fit a
      Gaussian mixture by EM, get a probability for each point, and choose the number of components
      by BIC, with no library besides NumPy, a fit that does not change with the thread count, and
      a refusal when a component collapses onto a few points.
    sources:
      - {kind: primary, date: 2026-11-21, who: maintainer, quote: "kmeans is obviously stats so it should be in statsx and then emeans aswell and then by extension hdbscan and so on no?"}
      - {kind: primary, date: 2026-11-21, who: maintainer, quote: "so e-means?"}
    proofs:
      - "test:tests/test_gaussian_mixture.py::test_a_planted_mixture_is_recovered"
      - "test:tests/test_gaussian_mixture.py::test_the_log_likelihood_never_decreases"
      - "test:tests/test_gaussian_mixture.py::test_the_log_likelihood_is_the_density_at_the_data"
      - "test:tests/test_gaussian_mixture.py::test_the_fit_does_not_depend_on_the_number_of_threads"
      - "test:tests/test_gaussian_mixture.py::test_more_starts_reach_a_higher_likelihood_where_one_start_is_stuck"
      - "test:tests/test_gaussian_mixture.py::test_a_collapsing_component_is_dropped_not_reported"
      - "test:tests/test_gaussian_mixture.py::test_bic_finds_three_components_in_gaussian_data"
      - "test:tests/test_gaussian_mixture.py::test_bic_adds_components_to_a_skewed_cluster"
    must: false

  - id: CL-3
    text: >
      When the caller has unlabelled points whose groups have any shape or different densities,
      and some points belong to no group, they can cluster them by DBSCAN or HDBSCAN with no
      number of clusters, with algorithms written from the papers, exact distances, no library
      besides NumPy, and a fit that does not change with the thread count.
    sources:
      - {kind: primary, date: 2026-11-21, who: maintainer, quote: "kmeans is obviously stats so it should be in statsx and then emeans aswell and then by extension hdbscan and so on no?"}
      - {kind: primary, date: 2026-11-21, who: maintainer, quote: "so, remember we are reimplementing this in rust from scratch!!! dont reuse scipy for anything. go to the papers preferable. and cite the papers in the documentation!!"}
    proofs:
      - "test:tests/test_density_clustering.py::test_dbscan_equals_the_algorithm_of_the_paper"
      - "test:tests/test_density_clustering.py::test_dbscan_counts_a_neighbour_exactly_at_eps_on_a_grid"
      - "test:tests/test_density_clustering.py::test_dbscan_follows_the_shape_of_two_moons_where_kmeans_cannot"
      - "test:tests/test_density_clustering.py::test_core_distances_and_the_tree_weight_equal_the_definitions"
      - "test:tests/test_density_clustering.py::test_hdbscan_equals_the_hierarchy_read_from_the_definitions"
      - "test:tests/test_density_clustering.py::test_hdbscan_finds_groups_of_different_density_that_no_single_eps_finds"
      - "test:tests/test_density_clustering.py::test_density_results_do_not_depend_on_the_number_of_threads"
      - "test:tests/test_density_clustering.py::test_a_small_min_cluster_size_finds_clusters_in_one_gaussian_cloud"
    must: false

  - id: CL-4
    text: >
      When the caller has many measurements per point, they can map the points to 2 or 3
      dimensions with UMAP, check how many neighbours the map keeps, and see the objective that the
      layout lowers, with an algorithm written in Rust from the paper, exact neighbours, no
      library besides NumPy, and a map that does not change with the thread count.
    sources:
      - {kind: primary, date: 2026-11-21, who: maintainer, quote: "no, but the umap implementations and kmeans emeans and so on can be implemented completeetly in statx without external needs and without extra installation required"}
      - {kind: primary, date: 2026-11-21, who: maintainer, quote: "so, remember we are reimplementing this in rust from scratch!!! dont reuse scipy for anything. go to the papers preferable. and cite the papers in the documentation!!"}
    proofs:
      - "test:tests/test_umap.py::test_the_curve_fit_is_a_least_squares_minimum_and_matches_the_known_constants"
      - "test:tests/test_umap.py::test_the_neighbours_are_the_exact_nearest_points"
      - "test:tests/test_umap.py::test_rho_sigma_and_the_graph_follow_section_3_1"
      - "test:tests/test_umap.py::test_the_spectral_vectors_equal_a_dense_eigendecomposition"
      - "test:tests/test_umap.py::test_the_cross_entropy_equals_definition_10"
      - "test:tests/test_umap.py::test_the_layout_reaches_the_cross_entropy_of_the_sequential_algorithm"
      - "test:tests/test_umap.py::test_the_layout_lowers_the_cross_entropy_and_keeps_the_neighbours_of_a_swiss_roll"
      - "test:tests/test_umap.py::test_the_map_does_not_depend_on_the_number_of_threads"
      - "test:tests/test_umap.py::test_pure_noise_gets_clusters_on_the_map_that_the_data_does_not_have"
    must: false
