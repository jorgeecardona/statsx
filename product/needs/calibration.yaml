who: caller checking a classifier or a set of raters

needs:

  - id: CA-1
    text: >
      When the caller checks classifier calibration, they can get a reliability diagram's numbers, ECE,
      and the Brier decomposition.
    sources:
      - {kind: secondary, date: 2026-11-12, locator: "design draft from a consumer project (private, not linked)"}
    proofs:
      - "test:tests/test_calibration.py::test_the_reliability_numbers_are_the_bin_means_and_the_ece_is_their_weighted_gap"
      - "test:tests/test_calibration.py::test_the_brier_score_equals_its_decomposition_exactly"
      - "test:tests/test_calibration.py::test_a_calibrated_classifier_has_a_small_ece_and_an_overconfident_one_a_large_one"

  - id: CA-2
    text: >
      When a classifier is miscalibrated, the caller can recalibrate it with isotonic or Platt
      scaling.
    sources:
      - {kind: secondary, date: 2026-11-12, locator: "design draft from a consumer project (private, not linked)"}
    proofs:
      - "test:tests/test_calibration.py::test_platt_scaling_and_isotonic_regression_repair_an_overconfident_classifier"
      - "test:tests/test_calibration.py::test_the_isotonic_map_never_decreases_and_stays_a_probability"
      - "test:tests/test_calibration.py::test_isotonic_regression_is_the_best_non_decreasing_fit"

  - id: CA-3
    text: >
      When the caller measures agreement between raters, they can get Cohen kappa, Fleiss kappa, and
      Krippendorff alpha (which handles missing ratings).
    sources:
      - {kind: secondary, date: 2026-11-12, locator: "design draft from a consumer project (private, not linked)"}
    proofs:
      - "test:tests/test_agreement.py::test_cohens_kappa_matches_the_textbook_example"
      - "test:tests/test_agreement.py::test_fleiss_kappa_matches_the_worked_example"
      - "test:tests/test_agreement.py::test_alpha_matches_the_reference_values_with_missing_ratings"
      - "test:tests/test_agreement.py::test_nominal_alpha_follows_its_definition_over_pairs_of_values"
