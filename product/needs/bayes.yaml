who: caller doing Bayesian inference

needs:

  - id: BA-1
    text: >
      When the caller updates a conjugate model (Beta-Binomial, Gamma-Poisson, Normal-Normal,
      Dirichlet-Multinomial), they can get the posterior in closed form as a named object.
    sources:
      - {kind: secondary, date: 2026-11-12, locator: "design draft from a consumer project (private, not linked)"}
    must: true
    proofs:
      - "test:tests/test_conjugate.py::test_each_conjugate_update_returns_the_closed_form_posterior_as_a_named_object"

  - id: BA-2
    text: >
      When the caller has two posteriors, they can get P(A > B) and the probability of practical
      equivalence.
    sources:
      - {kind: secondary, date: 2026-11-12, locator: "design draft from a consumer project (private, not linked)"}
    proofs:
      - "test:tests/test_compare.py::test_p_a_greater_matches_the_exact_value_for_two_betas"
      - "test:tests/test_compare.py::test_two_normals_match_the_exact_probabilities"
      - "test:tests/test_compare.py::test_a_wider_margin_gives_a_higher_probability_of_equivalence"

  - id: BA-3
    text: >
      When the caller has a calibrated 90% interval from an expert, they can get the matching lognormal
      prior.
    sources:
      - {kind: secondary, date: 2026-11-12, locator: "design draft from a consumer project (private, not linked)"}
    proofs:
      - "test:tests/test_compare.py::test_a_90_percent_interval_gives_the_matching_lognormal_prior"
      - "test:tests/test_compare.py::test_the_level_can_be_changed_and_the_prior_gets_wider_with_a_lower_level"

  - id: BA-4
    text: >
      When the caller fits a model with no conjugate form (hierarchical Beta-Binomial with a free
      pooling parameter, hierarchical regression), they can get MCMC draws.
    sources:
      - {kind: secondary, date: 2026-11-12, locator: "design draft from a consumer project (private, not linked)"}

  - id: BA-5
    text: >
      When MCMC finishes, the caller can get R-hat, ESS, and divergences from one shared check that
      refuses the result when it fails.
    sources:
      - {kind: secondary, date: 2026-11-12, locator: "design draft from a consumer project (private, not linked)"}
    must: true
    proofs:
      - "test:tests/test_diagnostics.py::test_one_check_reports_rhat_ess_and_divergences_and_refuses_when_any_fails"
      - "test:tests/test_diagnostics.py::test_matches_arviz_on_a_fixed_ar1_sample"

  - id: BA-6
    text: >
      When the caller installs the MCMC part, they can do it without JAX, PyTensor, or a C compiler.
    sources:
      - {kind: primary, date: 2026-11-11, who: maintainer, quote: "pymc has one big fat dependency no? also the other alternative depends on jax"}

  - id: BA-7
    text: >
      When the caller has a few repeated timings of two versions, they can get the probability that
      one is faster, the speedup with a credible interval, and the probability that the two are
      within a margin, from a Normal-Inverse-Gamma posterior that goes straight into compare.
    sources:
      - {kind: secondary, date: 2026-11-18, locator: "request from the ComputeML benchmark agent, approved by the maintainer (private, not linked)"}
    proofs:
      - "test:tests/test_nig.py::test_the_posterior_equals_the_intercept_only_duration_fit"
      - "test:tests/test_nig.py::test_the_reference_posterior_covers_at_the_stated_rate_at_n_5_for_any_noise"
      - "test:tests/test_nig.py::test_under_the_reference_prior_the_difference_matches_the_welch_interval"
      - "test:tests/test_nig.py::test_compare_takes_the_posteriors_directly_and_finds_version_b_faster"

  - id: BA-8
    text: >
      When the caller has a posterior method (their own sampler, an approximation, a conjugate
      update), they can check that it is correct with simulation-based calibration, and get the
      ranks tested and told whether the posterior is too narrow, too wide or biased.
    sources:
      - {kind: secondary, date: 2026-11-18, locator: "ecosystem survey of PyMC, NumPyro, Stan and BlackJAX requests (agent report, private); an SBC library exists only inside the PyMC stack"}
    proofs:
      - "test:tests/test_sbc.py::test_an_exact_posterior_passes_at_about_the_stated_error_rate"
      - "test:tests/test_sbc.py::test_a_posterior_that_is_too_narrow_is_named_too_narrow"
      - "test:tests/test_sbc.py::test_a_posterior_that_is_too_wide_is_named_too_wide"
      - "test:tests/test_sbc.py::test_a_shifted_posterior_is_named_biased_in_the_right_direction"

  - id: BA-9
    text: >
      When the caller has MCMC draws, they can get the Monte Carlo standard error of the posterior
      mean, standard deviation and a quantile, so they report a summary only to the digits the
      draws support.
    sources:
      - {kind: secondary, date: 2026-11-18, locator: "ecosystem survey of PyMC, NumPyro, Stan and BlackJAX requests (agent report, private): MCSE is in every diagnostics checklist and ArviZ needs SciPy for it"}
    proofs:
      - "test:tests/test_diagnostics.py::test_mcse_mean_matches_the_spread_of_the_mean_over_repeated_runs"
      - "test:tests/test_diagnostics.py::test_mcse_sd_matches_the_spread_of_the_sd_over_repeated_runs"
      - "test:tests/test_diagnostics.py::test_mcse_quantile_matches_the_spread_of_the_quantile_over_repeated_runs"

