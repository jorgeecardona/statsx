who: caller who acts on a statsx result

needs:

  - id: AS-1
    text: >
      When the caller gets a fit or a test result, they can see what it assumes and whether the data
      contradict it, so that a computation that ran is not read as a model that is right.
    sources:
      - {kind: primary, date: 2026-11-18, who: maintainer, quote: "just because we can do the computation and the computation give us something, that means that the underlying assumption can be forgotten"}
    proofs:
      - "test:tests/test_predictive_check.py::test_well_specified_series_are_rarely_flagged"
      - "test:tests/test_predictive_check.py::test_an_outlier_is_flagged_as_tails"
      - "test:tests/test_predictive_check.py::test_a_season_the_harmonics_cannot_hold_is_flagged_as_phase"
      - "test:tests/test_predictive_check.py::test_a_surplus_of_zeros_is_flagged"
      - "test:tests/test_predictive_check.py::test_counts_that_alternate_are_flagged_as_autocorrelation"
      - "test:tests/test_predictive_check.py::test_a_pulse_in_the_level_is_not_seen"
    must: false

  - id: ED-1
    text: >
      When the caller has two sets of points in high dimension (embeddings), they can test whether the
      sets come from one distribution, with a test that is valid on held-out points, and look at
      low-dimensional projections first.
    sources:
      - {kind: primary, date: 2026-11-18, who: maintainer, quote: "check if two sets of points come from the same distributions"}
    must: false
