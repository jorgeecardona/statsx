who: caller who replaces fastumap with statsx

needs:

  - id: MG-1
    text: >
      When the caller chose k in fastumap by the elbow, they can do it in statsx, see the inertia of every
      candidate and the rule that picked k, and get the same k for another seed on data with a clear answer.
    sources:
      - {kind: primary, date: 2026-11-26, who: maintainer, quote: "check their gitlab issues and take them as ours? so we have a plan to migrate"}
      - {kind: secondary, date: 2026-08-27, locator: "https://gitlab.com/cardona-oss/fastumap/-/work_items/25"}
      - {kind: secondary, date: 2026-11-11, locator: "https://gitlab.com/cardona-oss/fastumap/-/work_items/30"}
      - {kind: secondary, date: 2026-08-27, locator: "https://gitlab.com/cardona-oss/fastumap/-/work_items/24"}
    proofs:
      - "test:tests/test_clustering.py::test_find_knees_reproduces_figure_2_of_the_kneedle_paper"
      - "test:tests/test_clustering.py::test_find_knees_equals_the_algorithm_on_random_curves"
      - "test:tests/test_clustering.py::test_find_knees_checks_its_input"
      - "test:tests/test_clustering.py::test_the_elbow_finds_planted_clusters_for_any_seed"
      - "test:tests/test_clustering.py::test_the_elbow_result_holds_the_curve_it_used"
      - "test:tests/test_clustering.py::test_the_elbow_picks_a_k_for_uniform_data_which_has_no_clusters"
      - "test:tests/test_clustering.py::test_the_elbow_checks_its_input"
    must: false

  - id: MG-2
    text: >
      When the caller clusters text embeddings by the cosine distance, they can use it in k-means, DBSCAN,
      HDBSCAN and the choice of k.
    sources:
      - {kind: primary, date: 2026-11-26, who: maintainer, quote: "check their gitlab issues and take them as ours? so we have a plan to migrate"}
      - {kind: secondary, date: 2026-08-27, locator: "https://gitlab.com/cardona-oss/fastumap/-/work_items/24"}
      - {kind: secondary, date: 2026-08-27, locator: "https://gitlab.com/cardona-oss/fastumap/-/work_items/26"}
    proofs: []
    must: false

  - id: MG-3
    text: >
      When the caller assigns new points to existing centres, theirs or those of a fit, they get the distance
      to the centre and can mark far points as noise, in the distance the fit used.
    sources:
      - {kind: primary, date: 2026-11-26, who: maintainer, quote: "check their gitlab issues and take them as ours? so we have a plan to migrate"}
      - {kind: secondary, date: 2026-08-25, locator: "https://gitlab.com/cardona-oss/fastumap/-/work_items/20"}
      - {kind: secondary, date: 2026-08-27, locator: "https://gitlab.com/cardona-oss/fastumap/-/work_items/26"}
      - {kind: secondary, date: 2026-08-27, locator: "https://gitlab.com/cardona-oss/fastumap/-/work_items/27"}
    proofs: []
    must: false

  - id: MG-4
    text: >
      When the caller fits clusters, they get the size and the spread of each cluster in the distance of the
      fit.
    sources:
      - {kind: primary, date: 2026-11-26, who: maintainer, quote: "check their gitlab issues and take them as ours? so we have a plan to migrate"}
      - {kind: secondary, date: 2026-08-27, locator: "https://gitlab.com/cardona-oss/fastumap/-/work_items/28"}
    proofs: []
