who: caller who replaces fastumap with statsx

needs:

  - id: MG-1
    text: >
      When the caller chose k in fastumap by the elbow, they can do it in statsx, see the inertia of every
      candidate and the rule that picked k, and get the same k for another seed on data with a clear answer.
    sources:
      - {kind: primary, date: 2026-11-26, who: maintainer, quote: "check their gitlab issues and take them as ours? so we have a plan to migrate"}
      - {kind: secondary, date: 2026-08-27, locator: "https://gitlab.com/cardona-oss/fastumap/-/work_items/25"}
      - {kind: secondary, date: 2026-11-11, locator: "https://gitlab.com/cardona-oss/fastumap/-/work_items/30"}
      - {kind: secondary, date: 2026-08-27, locator: "https://gitlab.com/cardona-oss/fastumap/-/work_items/24"}
    proofs:
      - "test:tests/test_clustering.py::test_find_knees_reproduces_figure_2_of_the_kneedle_paper"
      - "test:tests/test_clustering.py::test_find_knees_equals_the_algorithm_on_random_curves"
      - "test:tests/test_clustering.py::test_find_knees_checks_its_input"
      - "test:tests/test_clustering.py::test_the_elbow_finds_planted_clusters_for_any_seed"
      - "test:tests/test_clustering.py::test_the_elbow_result_holds_the_curve_it_used"
      - "test:tests/test_clustering.py::test_the_elbow_picks_a_k_for_uniform_data_which_has_no_clusters"
      - "test:tests/test_clustering.py::test_the_elbow_checks_its_input"
    must: false

  - id: MG-2
    text: >
      When the caller clusters text embeddings by the cosine distance, they can use it in k-means, DBSCAN,
      HDBSCAN and the choice of k.
    sources:
      - {kind: primary, date: 2026-11-26, who: maintainer, quote: "check their gitlab issues and take them as ours? so we have a plan to migrate"}
      - {kind: secondary, date: 2026-08-27, locator: "https://gitlab.com/cardona-oss/fastumap/-/work_items/24"}
      - {kind: secondary, date: 2026-08-27, locator: "https://gitlab.com/cardona-oss/fastumap/-/work_items/26"}
    proofs:
      - "test:tests/test_clustering.py::test_cosine_kmeans_reaches_the_best_partition_on_a_small_set"
      - "test:tests/test_clustering.py::test_a_cosine_fit_has_unit_centres_and_labels_by_the_largest_cosine"
      - "test:tests/test_clustering.py::test_cosine_kmeans_ignores_the_length_of_a_row_and_predicts_by_cosine"
      - "test:tests/test_clustering.py::test_the_cosine_fit_does_not_depend_on_the_number_of_threads"
      - "test:tests/test_clustering.py::test_the_cosine_elbow_finds_the_directions_whatever_the_lengths"
      - "test:tests/test_clustering.py::test_cosine_kmeans_refuses_zero_rows_and_unknown_metrics"
      - "test:tests/test_density_clustering.py::test_cosine_dbscan_equals_the_algorithm_on_cosine_distances"
      - "test:tests/test_density_clustering.py::test_cosine_k_distances_equal_the_definition"
      - "test:tests/test_density_clustering.py::test_cosine_hdbscan_equals_the_hierarchy_of_the_cosine_distance"
      - "test:tests/test_density_clustering.py::test_cosine_densities_ignore_the_length_of_a_row"
      - "test:tests/test_density_clustering.py::test_cosine_scaled_copies_are_at_distance_zero_and_stabilities_stay_finite"
      - "test:tests/test_density_clustering.py::test_cosine_density_functions_refuse_zero_rows_and_unknown_metrics"
    must: false

  - id: MG-3
    text: >
      When the caller assigns new points to existing centres, theirs or those of a fit, they get the distance
      to the centre and can mark far points as noise, in the distance the fit used.
    sources:
      - {kind: primary, date: 2026-11-26, who: maintainer, quote: "check their gitlab issues and take them as ours? so we have a plan to migrate"}
      - {kind: secondary, date: 2026-08-25, locator: "https://gitlab.com/cardona-oss/fastumap/-/work_items/20"}
      - {kind: secondary, date: 2026-08-27, locator: "https://gitlab.com/cardona-oss/fastumap/-/work_items/26"}
      - {kind: secondary, date: 2026-08-27, locator: "https://gitlab.com/cardona-oss/fastumap/-/work_items/27"}
    proofs:
      - "test:tests/test_clustering.py::test_assign_clusters_equals_the_nearest_centre_by_definition"
      - "test:tests/test_clustering.py::test_a_row_at_the_limit_keeps_its_label_and_a_tie_goes_to_the_first_centre"
      - "test:tests/test_clustering.py::test_a_fit_assigns_in_its_own_distance"
      - "test:tests/test_clustering.py::test_assign_clusters_checks_its_input"
      - "test:tests/test_clustering.py::test_kmeans_and_the_silhouette_are_unchanged_far_from_the_origin"
    must: false

  - id: MG-4
    text: >
      When the caller fits clusters, they get the size and the spread of each cluster in the distance of the
      fit.
    sources:
      - {kind: primary, date: 2026-11-26, who: maintainer, quote: "check their gitlab issues and take them as ours? so we have a plan to migrate"}
      - {kind: secondary, date: 2026-08-27, locator: "https://gitlab.com/cardona-oss/fastumap/-/work_items/28"}
    proofs:
      - "test:tests/test_clustering.py::test_the_dispersion_is_the_mean_distance_of_each_cluster_to_its_centre"
      - "test:tests/test_clustering.py::test_a_wide_cluster_has_a_larger_dispersion_than_a_tight_one_of_the_same_size"
    must: false

  - id: MG-5
    text: >
      When the caller runs the calls of fastumap on 1024-column embeddings, at 5,000 points on half a CPU and
      at 1,000,000 points, they know the time and memory of statsx against fastumap, and statsx is not
      slower by a margin that stops the switch. float32 input is not copied to float64 without need.
    sources:
      - {kind: primary, date: 2026-11-26, who: maintainer, quote: "check their gitlab issues and take them as ours? so we have a plan to migrate"}
      - {kind: secondary, date: 2026-08-23, locator: "https://gitlab.com/cardona-oss/fastumap/-/work_items/2"}
      - {kind: secondary, date: 2026-08-24, locator: "https://gitlab.com/cardona-oss/fastumap/-/work_items/6"}
      - {kind: secondary, date: 2026-08-25, locator: "https://gitlab.com/cardona-oss/fastumap/-/work_items/18"}
      - {kind: secondary, date: 2026-11-11, locator: "https://gitlab.com/cardona-oss/fastumap/-/work_items/29"}
    proofs: []
    must: false

  - id: MG-6
    text: >
      When the caller runs statsx inside a CPU-limited container and from several threads, the default does
      not start more workers than the container may use, concurrent calls are tested, and a second process
      gives the same result.
    sources:
      - {kind: primary, date: 2026-11-26, who: maintainer, quote: "check their gitlab issues and take them as ours? so we have a plan to migrate"}
      - {kind: secondary, date: 2026-08-23, locator: "https://gitlab.com/cardona-oss/fastumap/-/work_items/3"}
      - {kind: secondary, date: 2026-08-24, locator: "https://gitlab.com/cardona-oss/fastumap/-/work_items/10"}
    proofs: []
    must: false

  - id: MG-7
    text: >
      When the caller refreshes a map, they can start the layout from earlier positions, without the input
      array being changed, so that the two maps can be compared.
    sources:
      - {kind: primary, date: 2026-11-26, who: maintainer, quote: "check their gitlab issues and take them as ours? so we have a plan to migrate"}
      - {kind: secondary, date: 2026-08-24, locator: "https://gitlab.com/cardona-oss/fastumap/-/work_items/12"}
      - {kind: secondary, date: 2026-08-24, locator: "https://gitlab.com/cardona-oss/fastumap/-/work_items/15"}
      - {kind: secondary, date: 2026-08-25, locator: "https://gitlab.com/cardona-oss/fastumap/-/work_items/16"}
    proofs: []
    must: false

  - id: MG-8
    text: >
      When the caller has labels for some points, they can let the labels guide the map.
    sources:
      - {kind: primary, date: 2026-11-26, who: maintainer, quote: "check their gitlab issues and take them as ours? so we have a plan to migrate"}
      - {kind: secondary, date: 2026-08-24, locator: "https://gitlab.com/cardona-oss/fastumap/-/work_items/13"}
    proofs: []
    must: false

  - id: MG-9
    text: >
      When the caller maps or clusters more points than exact neighbours can handle in their time, they can
      use approximate neighbours.
    sources:
      - {kind: primary, date: 2026-11-26, who: maintainer, quote: "check their gitlab issues and take them as ours? so we have a plan to migrate"}
      - {kind: secondary, date: 2026-08-25, locator: "https://gitlab.com/cardona-oss/fastumap/-/work_items/17"}
    proofs: []
    must: false

  - id: MG-10
    text: >
      When the caller clusters or maps embeddings with hundreds of columns, they can reduce them to
      the principal components first, project new rows the same way, and see how much variance
      was kept.
    sources:
      - {kind: primary, date: 2026-11-26, who: maintainer, quote: "please"}
      - {kind: secondary, date: 2026-11-26, locator: "https://gitlab.com/cardona-oss/statsx/-/work_items/17"}
    proofs:
      - "test:tests/test_pca.py::test_the_components_equal_the_singular_vectors_of_the_centred_data"
      - "test:tests/test_pca.py::test_the_variance_and_the_reconstruction_error_follow_the_definitions"
      - "test:tests/test_pca.py::test_the_sign_of_each_component_is_fixed_and_new_rows_project_the_same_way"
      - "test:tests/test_pca.py::test_principal_components_first_let_the_elbow_find_the_groups_of_wide_data"
      - "test:tests/test_pca.py::test_principal_components_lose_groups_that_differ_in_a_small_direction"
      - "test:tests/test_pca.py::test_pca_checks_its_input"
    must: false
