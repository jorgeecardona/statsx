  - id: MG-5
    text: >
      When the caller runs the calls of fastumap on 1024-column embeddings, at 5,000 points on half a CPU and
      at 1,000,000 points, they know the time and memory of statsx against fastumap, and statsx is not
      slower by a margin that stops the switch. float32 input is not copied to float64 without need.
    sources:
      - {kind: primary, date: 2026-11-26, who: maintainer, quote: "check their gitlab issues and take them as ours? so we have a plan to migrate"}
      - {kind: secondary, date: 2026-08-23, locator: "https://gitlab.com/cardona-oss/fastumap/-/work_items/2"}
